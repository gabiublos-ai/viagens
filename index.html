<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Viagens Corporativas</title>
<meta name="description" content="Lançamento de viagens, Uber corporativo, calendário e painéis de custo.">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>✈️</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8l3.4 3.9-2 2-2.2-.6a.5.5 0 0 0-.5.8L5 15.5 6.4 18l1.4-1.5.6 2.2a.5.5 0 0 0 .8.2l2-2 3.9 3.4a.5.5 0 0 0 .8-.5Z"/>
        </svg>
      </span>
      <span>
        <div class="brand-name">Gestão de Viagens</div>
        <div class="brand-sub">Ace Gaming · apostou.bet.br</div>
      </span>
    </div>

    <span class="topbar-spacer"></span>

    <label class="field" style="flex-direction:row;align-items:center;gap:7px">
      <span class="eyebrow">Ano</span>
      <select id="ano" aria-label="Ano de referência"></select>
    </label>

    <button class="icon-btn" id="btn-tema" data-acao="tema" title="Alternar tema" aria-label="Alternar tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
        <circle cx="12" cy="12" r="4"/>
      </svg>
    </button>

    <button class="btn btn-primary" data-acao="nova-viagem">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Nova viagem
    </button>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Seções"></nav>
</header>

<main id="view"></main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/seed.js"></script>
<script src="assets/core.js"></script>
<script src="assets/views.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
