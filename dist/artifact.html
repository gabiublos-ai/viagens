<title>Gestão de Viagens Corporativas</title>
<style>
/* Gestão de Viagens Corporativas — folha de estilo única.
   Tokens no :root (claro). O modo escuro redefine só os tokens, nos dois escopos:
   media query (preferência do sistema) e [data-theme] (alternância manual). */

:root {
  color-scheme: light;

  --ground:        #f1f4f5;
  --surface:       #ffffff;
  --surface-2:     #e9eff0;
  --surface-3:     #dde6e7;

  --text:          #12211f;
  --text-2:        #55696a;
  --text-3:        #83969a;

  --border:        #d7e1e3;
  --border-strong: #b9c8cb;

  --accent:        #0d5c63;
  --accent-hover:  #0a474d;
  --accent-ink:    #ffffff;
  --accent-soft:   #dfeced;
  --accent-line:   #9cc4c7;

  --good:          #0ca30c;
  --warning:       #b07600;
  --warning-bg:    #fdf3dc;
  --serious:       #c25a2c;
  --critical:      #d03b3b;
  --critical-bg:   #fbe6e6;
  --good-bg:       #e2f3e2;

  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;

  --grid:          #e6ecee;
  --shadow:        0 1px 2px rgba(18, 33, 31, .06), 0 8px 24px rgba(18, 33, 31, .08);

  --r-sm: 5px;
  --r:    8px;
  --r-lg: 12px;

  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:        #0d1413;
    --surface:       #151d1d;
    --surface-2:     #1d2828;
    --surface-3:     #263332;
    --text:          #edf3f2;
    --text-2:        #a3b5b3;
    --text-3:        #7d908e;
    --border:        #2a3837;
    --border-strong: #3b4c4b;
    --accent:        #4fb3ba;
    --accent-hover:  #6ac6cc;
    --accent-ink:    #062023;
    --accent-soft:   #16302f;
    --accent-line:   #2f5f61;
    --good:          #34b334;
    --good-bg:       #12301a;
    --warning:       #e0a92c;
    --warning-bg:    #2f2717;
    --serious:       #ec835a;
    --critical:      #e66767;
    --critical-bg:   #331b1b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --grid:          #223030;
    --shadow:        0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:        #0d1413;
  --surface:       #151d1d;
  --surface-2:     #1d2828;
  --surface-3:     #263332;
  --text:          #edf3f2;
  --text-2:        #a3b5b3;
  --text-3:        #7d908e;
  --border:        #2a3837;
  --border-strong: #3b4c4b;
  --accent:        #4fb3ba;
  --accent-hover:  #6ac6cc;
  --accent-ink:    #062023;
  --accent-soft:   #16302f;
  --accent-line:   #2f5f61;
  --good:          #34b334;
  --good-bg:       #12301a;
  --warning:       #e0a92c;
  --warning-bg:    #2f2717;
  --serious:       #ec835a;
  --critical:      #e66767;
  --critical-bg:   #331b1b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --grid:          #223030;
  --shadow:        0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
p { margin: 0; }

button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.eyebrow {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text-3);
}

/* ---------- Cabeçalho ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.topbar-row {
  max-width: 1460px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

.brand-mark {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: var(--accent-ink);
  flex: none;
}
.brand-mark svg { width: 17px; height: 17px; }

.brand-name { font-weight: 650; letter-spacing: -.015em; white-space: nowrap; }
.brand-sub { font-size: 11px; color: var(--text-3); white-space: nowrap; }

.topbar-spacer { flex: 1; }

.tabs {
  max-width: 1460px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: thin;
}

.tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 9px 12px;
  color: var(--text-2);
  font-weight: 550;
  cursor: pointer;
  white-space: nowrap;
  border-radius: var(--r-sm) var(--r-sm) 0 0;
}
.tab:hover { color: var(--text); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------- Botões ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  padding: 7px 13px;
  border-radius: var(--r-sm);
  font-weight: 550;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(.5px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }

.btn-sm { padding: 4px 9px; font-size: 12.5px; }
.btn-danger { color: var(--critical); border-color: var(--border-strong); }
.btn-danger:hover { background: var(--critical-bg); border-color: var(--critical); }

.icon-btn {
  appearance: none; border: 1px solid transparent; background: none;
  color: var(--text-2); cursor: pointer; padding: 5px;
  border-radius: var(--r-sm); display: inline-grid; place-items: center;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; display: block; }

/* ---------- Formulários ---------- */

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.field .hint { font-size: 11.5px; color: var(--text-3); }

input[type="text"], input[type="date"], input[type="search"], input[type="number"], select, textarea {
  width: 100%;
  padding: 7px 10px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 64px; }
input.money { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
input[readonly] { background: var(--surface-2); color: var(--text-2); }

/* ---------- Layout ---------- */

main { max-width: 1460px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.card-head {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.card-head .grow { flex: 1; }
.card-body { padding: 16px; }
.card-body.flush { padding: 0; }

.grid { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- KPIs ---------- */

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.kpi-value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.kpi-value.sm { font-size: 20px; }
.kpi-note { font-size: 11.5px; color: var(--text-3); }

/* ---------- Tabelas ---------- */

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-2);
  text-align: left;
  font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-2);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tbody tr:hover td { background: var(--surface-2); }
tfoot td { padding: 9px 10px; font-weight: 650; border-top: 1px solid var(--border-strong); background: var(--surface-2); }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th.n { text-align: right; }
td.zero { color: var(--text-3); }
.t-sub { font-size: 11.5px; color: var(--text-3); }
.nowrap { white-space: nowrap; }
.row-alt td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }

/* ---------- Chips / status ---------- */

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 100px;
  font-size: 11.5px; font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.chip.ok      { background: var(--good-bg); color: var(--good); border-color: transparent; }
.chip.warn    { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
.chip.crit    { background: var(--critical-bg); color: var(--critical); border-color: transparent; }
.chip.accent  { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.route {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .04em;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 1px 6px;
  white-space: nowrap;
}

.person { display: flex; align-items: center; gap: 9px; min-width: 0; }
.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
  font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
  flex: none;
}
.person-name { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Gráficos ---------- */

.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--sans); fill: var(--text-2); }
.chart .axis-line { stroke: var(--border); stroke-width: 1; }
.chart .grid-line { stroke: var(--grid); stroke-width: 1; }
.chart .bar { transition: opacity .12s ease; }
.chart .bar:hover { opacity: .75; cursor: default; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 0 16px 14px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

.tip {
  position: fixed; z-index: 90; pointer-events: none;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  box-shadow: var(--shadow);
  padding: 8px 10px; font-size: 12px; max-width: 260px;
  opacity: 0; transition: opacity .1s ease;
}
.tip.on { opacity: 1; }
.tip b { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Calendário ---------- */

.cal { border-collapse: separate; border-spacing: 0; font-size: 12px; }
.cal th, .cal td { border-bottom: 1px solid var(--grid); }
.cal .day { text-align: center; width: 26px; padding: 6px 0; font-family: var(--mono); }
.cal .name-col { position: sticky; left: 0; background: var(--surface); z-index: 2; min-width: 190px; padding-left: 12px; }
.cal thead .name-col { background: var(--surface-2); z-index: 3; }
.cal .wknd { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.cal-mark { display: grid; place-items: center; height: 20px; border-radius: 3px; font-size: 11px; line-height: 1; }
.cal-mark.go   { background: var(--accent); color: var(--accent-ink); }
.cal-mark.stay { background: var(--accent-soft); color: var(--accent); }
.cal-mark.back { background: var(--accent); color: var(--accent-ink); }

/* ---------- Modal ---------- */

dialog.modal {
  padding: 0; border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface); color: var(--text);
  box-shadow: var(--shadow);
  width: min(940px, calc(100vw - 28px));
  max-height: calc(100vh - 40px);
}
dialog.modal::backdrop { background: rgba(8, 18, 17, .45); backdrop-filter: blur(2px); }
dialog.narrow { width: min(560px, calc(100vw - 28px)); }
.modal-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 2;
}
.modal-body { padding: 18px; overflow-y: auto; }
.modal-foot {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 18px; border-top: 1px solid var(--border);
  position: sticky; bottom: 0; background: var(--surface);
}
.modal-foot .grow { flex: 1; }

.form-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 13px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; }
.c8 { grid-column: span 8; } .c12 { grid-column: span 12; }

.section-label {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 10px;
  margin-top: 4px;
}
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.summary {
  position: sticky;
  bottom: -18px;
  z-index: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.summary-line { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; }
.summary-line .num { color: var(--text); }
.summary-total { font-size: 15px; font-weight: 650; padding-top: 8px; border-top: 1px solid var(--border-strong); }

.picker { border: 1px solid var(--border-strong); border-radius: var(--r-sm); max-height: 210px; overflow-y: auto; }
.picker label {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--grid);
}
.picker label:hover { background: var(--surface-2); }
.picker input { width: auto; }
.picker .p-area { margin-left: auto; font-size: 11px; color: var(--text-3); }

/* ---------- Tela de entrada ---------- */

body.trancado .topbar-row > *:not(.brand),
body.trancado .tabs { display: none; }

.entrada {
  max-width: 380px;
  margin: 8vh auto 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 30px 28px 26px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.entrada h1 { font-size: 21px; font-weight: 650; letter-spacing: -.02em; margin: 0; }
.entrada-sub { font-size: 12.5px; color: var(--text-3); margin: -12px 0 6px; }
.entrada-marca {
  width: 40px; height: 40px; border-radius: var(--r);
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; margin-bottom: 4px;
}
.entrada-marca svg { width: 22px; height: 22px; }
.entrada .btn { justify-content: center; padding: 9px; margin-top: 4px; }
.entrada-erro { font-size: 12.5px; color: var(--critical); min-height: 1.2em; margin: 0; }

/* ---------- Diversos ---------- */

.toolbar { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
.toolbar select, .toolbar input[type="search"], .toolbar input[type="text"] { width: auto; min-width: 120px; }
.card-head select, .card-head input { width: auto; }
.toolbar .search { min-width: 200px; }

.empty { padding: 40px 20px; text-align: center; color: var(--text-3); }
.empty strong { display: block; color: var(--text-2); margin-bottom: 4px; }

.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--text); color: var(--surface);
  padding: 9px 15px; border-radius: 100px; font-size: 13px; font-weight: 550;
  box-shadow: var(--shadow);
  animation: rise .18s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.note {
  border-left: 3px solid var(--accent-line);
  background: var(--accent-soft);
  padding: 10px 13px;
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 12.5px;
  color: var(--text-2);
}
.note.warn { border-left-color: var(--warning); background: var(--warning-bg); }

.actions-cell { display: flex; gap: 2px; justify-content: flex-end; }

/* Ações sempre alcançáveis, mesmo com a tabela rolando na horizontal */
th.col-acoes, td.col-acoes {
  position: sticky;
  right: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
}
thead th.col-acoes { background: var(--surface-2); }
tbody tr:hover td.col-acoes { background: var(--surface-2); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

@media (max-width: 720px) {
  main { padding: 14px; gap: 14px; }
  .topbar-row { padding: 9px 14px; gap: 10px; }
  .brand-sub { display: none; }
  .tabs { padding: 0 14px; }
  .c3, .c4, .c6, .c8 { grid-column: span 12; }
  .kpi-value { font-size: 21px; }
}

</style>
<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8l3.4 3.9-2 2-2.2-.6a.5.5 0 0 0-.5.8L5 15.5 6.4 18l1.4-1.5.6 2.2a.5.5 0 0 0 .8.2l2-2 3.9 3.4a.5.5 0 0 0 .8-.5Z"/>
        </svg>
      </span>
      <span>
        <div class="brand-name">Gestão de Viagens</div>

    <label class="field" style="flex-direction:row;align-items:center;gap:7px">
      <span class="eyebrow">Ano</span>

    </label>

    <span id="sessao" class="row" style="gap:6px" hidden></span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>

      </svg>

      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">

<script>
/* Onde os dados ficam.
 *
 * Dois modos, mesma interface:
 *   servidor — site com senha; todo mundo lança na mesma base (window.MODO_SERVIDOR)
 *   local    — arquivo aberto direto no navegador; os dados ficam só naquela máquina
 *
 * Em modo servidor, cada operação devolve o estado inteiro já atualizado, então
 * nenhum cliente fica com uma versão pela metade.
 */

(function () {
  "use strict";

  var CHAVE_LOCAL = "gvc.v1";
  var servidor = !!window.MODO_SERVIDOR;

  // ---------- modo servidor ----------

  function chamar(metodo, rota, corpo) {
    return fetch("/api" + rota, {
      method: metodo,
      headers: corpo ? { "content-type": "application/json" } : undefined,
      body: corpo ? JSON.stringify(corpo) : undefined,
      credentials: "same-origin"
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (dados) {
        if (r.ok) return dados;
        var e = new Error(dados.erro || "Falha na comunicação com o servidor.");
        e.status = r.status;
        e.dados = dados;
        throw e;
      });
    });
  }

  var Servidor = {
    modo: "servidor",

    /** Devolve {autenticado, estado} — sem lançar erro quando é só falta de sessão. */
    iniciar: function () {
      return chamar("GET", "/estado").then(
        function (estado) { return { autenticado: true, estado: estado }; },
        function (e) {
          if (e.status === 401) return { autenticado: false };
          throw e;
        }
      );
    },

    entrar: function (senha, nome) {
      return chamar("POST", "/sessao", { senha: senha, nome: nome });
    },

    sair: function () { return chamar("DELETE", "/sessao"); },

    revisao: function () { return chamar("GET", "/revisao"); },
    estado: function () { return chamar("GET", "/estado"); },

    salvarViagem: function (viagem) { return chamar("PUT", "/viagem", { viagem: viagem }); },
    excluirViagem: function (id) { return chamar("DELETE", "/viagem/" + encodeURIComponent(id)); },

    salvarColaborador: function (colaborador, nomeOriginal) {
      return chamar("PUT", "/colaborador", { colaborador: colaborador, nomeOriginal: nomeOriginal || "" });
    },
    excluirColaborador: function (nome) {
      return chamar("DELETE", "/colaborador/" + encodeURIComponent(nome));
    },

    importarUber: function (linhas) { return chamar("POST", "/uber", { linhas: linhas }); },
    excluirCorrida: function (linha) { return chamar("DELETE", "/uber", { linha: linha }); },
    limparUber: function () { return chamar("DELETE", "/uber/tudo"); },

    salvarParams: function (params) { return chamar("PUT", "/params", { params: params }); },

    restaurarEstado: function (dados) { return chamar("PUT", "/estado", { dados: dados }); },
    restaurarBase: function () { return chamar("POST", "/base-original"); }
  };

  // ---------- modo local ----------

  /**
   * No modo local o app é dono do estado: cada operação mexe no objeto em memória
   * (quem chama já fez isso) e aqui só persistimos e devolvemos o mesmo estado.
   */
  function Local(obterDados) {
    function persistir() {
      var estado = {
        revisao: 0,
        atualizadoEm: new Date().toISOString(),
        atualizadoPor: "",
        dados: obterDados()
      };
      try {
        localStorage.setItem(CHAVE_LOCAL, JSON.stringify(estado.dados));
      } catch (e) {
        console.warn("Não foi possível gravar no navegador:", e);
      }
      return Promise.resolve(estado);
    }

    var api = {
      modo: "local",
      iniciar: function () {
        var dados = null;
        try {
          var bruto = localStorage.getItem(CHAVE_LOCAL);
          if (bruto) dados = JSON.parse(bruto);
        } catch (e) { /* armazenamento indisponível — começa da base original */ }
        return Promise.resolve({ autenticado: true, estado: dados ? { revisao: 0, dados: dados } : null });
      },
      entrar: function () { return Promise.resolve({}); },
      sair: function () { return Promise.resolve({}); },
      revisao: function () { return Promise.resolve({ revisao: 0 }); },
      estado: function () { return persistir(); }
    };

    ["salvarViagem", "excluirViagem", "salvarColaborador", "excluirColaborador",
     "importarUber", "excluirCorrida", "limparUber", "salvarParams",
     "restaurarEstado", "restaurarBase"].forEach(function (nome) {
      api[nome] = persistir;
    });

    return api;
  }

  window.Armazenamento = {
    ehServidor: servidor,
    criar: function (obterDados) { return servidor ? Servidor : Local(obterDados); }
  };
})();

</script>
<script>
/* Núcleo: estado, persistência e todas as regras de cálculo.
   As regras reproduzem exatamente as fórmulas da planilha original. */

(function () {
  "use strict";

  var STORAGE_KEY = "gvc.v1";

  // ---------- utilidades ----------

  var MESES_CURTOS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  var MESES_LONGOS = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
                      "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

  function brl(v, casas) {
    var n = Number(v) || 0;
    return n.toLocaleString("pt-BR", {
      minimumFractionDigits: casas === undefined ? 2 : casas,
      maximumFractionDigits: casas === undefined ? 2 : casas
    });
  }

  function brlSigla(v) { return "R$ " + brl(v); }

  /** Compacta valores altos para eixos de gráfico: 12.400 → "12,4 mil". */
  function brlCurto(v) {
    var n = Number(v) || 0;
    if (Math.abs(n) >= 1000) return brl(n / 1000, 1) + " mil";
    return brl(n, 0);
  }

  /** Aceita "1.234,56", "1234.56", "1234,5" ou vazio. */
  function parseNum(txt) {
    if (typeof txt === "number") return txt;
    if (!txt) return 0;
    var s = String(txt).trim().replace(/[R$\s]/g, "");
    if (!s) return 0;
    if (s.indexOf(",") > -1) s = s.replace(/\./g, "").replace(",", ".");
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

  /** "2026-08-17" → Date local (sem deslocamento de fuso). */
  function toDate(iso) {
    if (!iso) return null;
    var p = String(iso).split("-");
    if (p.length !== 3) return null;

    if (!mesRef) return "—";
    var p = mesRef.split("/");
    var m = +p[0];
    if (!m) return mesRef;
    var nome = MESES_CURTOS[m - 1];
    return nome.charAt(0).toUpperCase() + nome.slice(1) + "/" + String(p[1]).slice(-2);
  }

  function mesNome(mesRef) {
    var p = String(mesRef || "").split("/");
    return MESES_LONGOS[+p[0] - 1] ? MESES_LONGOS[+p[0] - 1] + " de " + p[1] : mesRef;

  // ---------- estado ----------

  /** Usado só quando o estado guardado vem sem alguma lista (defesa). */

    statuses: ["Fechado", "Cotado", "Pendente", "Cancelado", "Alterada"],
    servicos: [], tiposTransacao: [],
    palavrasAeroporto: ["aeroport", "airport", "terminal", "linneu gomes", "confins", "rocha pombo"],

      colaboradores: s.colaboradores,
      viagens: s.viagens,

  function assume(estado) {

      db = estado.dados;
      meta.revisao = estado.revisao || 0;
      meta.atualizadoEm = estado.atualizadoEm || "";
      meta.atualizadoPor = estado.atualizadoPor || "";

  /**

  function atualizaBaseEquipe() {
    if (!window.SEED) return 0;
    var versaoSeed = window.SEED.baseEquipeVersao || 0;
    if (!versaoSeed || (db.baseEquipeVersao || 0) >= versaoSeed) return 0;

    var porNome = {};
    db.colaboradores.forEach(function (c) { porNome[normal(c.nome)] = c; });

    var mexidos = 0;
    clone(window.SEED.colaboradores).forEach(function (novo) {
      var alvo = porNome[normal(novo.nome)];
      if (!alvo) { db.colaboradores.push(novo); mexidos++; return; }
      var mudou = false;
      Object.keys(novo).forEach(function (campo) {
        if (campo === "nome" || !novo[campo]) return;
        if (alvo[campo] !== novo[campo]) { alvo[campo] = novo[campo]; mudou = true; }
      });
      if (mudou) mexidos++;

  function normalizaEstado() {

    db.params = db.params || {};

      if (!db.params[k]) db.params[k] = clone(base[k] || PARAMS_PADRAO[k] || []);

    db.params.regras = Object.assign({}, PARAMS_PADRAO.regras, base.regras || {}, db.params.regras || {});

      db = estado.dados;
      meta.revisao = estado.revisao || 0;
      meta.atualizadoEm = estado.atualizadoEm || "";
      meta.atualizadoPor = estado.atualizadoPor || "";

  function recarregar() {

  function revisaoRemota() { return armazem.revisao(); }

  function substituirEstado(dados) {
    if (armazem.modo === "servidor") return armazem.restaurarEstado(dados).then(aplica);
    db = dados;
    normalizaEstado();
    return armazem.restaurarEstado(dados).then(aplica);
  }

  function restaurarBase() {

  // ---------- colaboradores ----------

  function colaborador(nome) {
    if (!nome) return null;

    return null;
  }

  function areaDe(nome) { var c = colaborador(nome); return c ? c.area : "—"; }
  function gestorDe(nome) { var c = colaborador(nome); return c && c.gestor ? c.gestor : "—"; }

  function areas() {
    var set = {};
    db.colaboradores.forEach(function (c) { if (c.area) set[c.area] = 1; });
    return Object.keys(set).sort(ordenaPt);
  }

  function colaboradoresOrdenados() {
    return db.colaboradores.slice().sort(function (a, b) { return ordenaPt(a.nome, b.nome); });
  }

  /** Cria ou atualiza um cadastro. Renomear leva junto as viagens e o De-Para. */
  function salvarColaborador(dados, nomeOriginal) {
    var limpo = Object.assign({}, dados);
    limpo.nome = String(limpo.nome || "").trim();
    if (!limpo.nome) return Promise.reject(new Error("Informe o nome do colaborador."));

    if (armazem.modo === "servidor") {
      return armazem.salvarColaborador(limpo, nomeOriginal || "").then(aplica);
    }

    var chave = normal(nomeOriginal || limpo.nome);
    var alvo = null;
    db.colaboradores.forEach(function (c) { if (normal(c.nome) === chave) alvo = c; });
    if (alvo) {
      if (nomeOriginal && normal(nomeOriginal) !== normal(limpo.nome)) {
        db.viagens.forEach(function (v) { if (normal(v.colaborador) === chave) v.colaborador = limpo.nome; });
        db.params.dePara.forEach(function (m) { if (normal(m.colaborador) === chave) m.colaborador = limpo.nome; });
      }

      db.colaboradores.push(limpo);
    }
    db.colaboradores.sort(function (a, b) { return ordenaPt(a.nome, b.nome); });

  // ---------- regras de viagem ----------

  /** Valor devido de alimentação por pernoite (jantar + café da manhã). */
  function porPernoite() {

    return (Number(r.jantar) || 0) + (Number(r.cafe) || 0);
  }

  /**
   * Calcula os campos derivados de uma viagem — espelha as fórmulas da aba Viagens.
   * Entrada: registro cru. Saída: objeto com os derivados.

  function calc(v) {
    var noites = Math.max(0, diasEntre(v.dataIda, v.dataVolta));
    var hospedagem = round2((Number(v.diarias) || 0) * (Number(v.valorDiaria) || 0));
    var total = round2((Number(v.aereo) || 0) + hospedagem + (Number(v.alimentacao) || 0) +
                       (Number(v.transporte) || 0) + (Number(v.custoAlteracao) || 0));
    var alimDevida = round2(noites * porPernoite());
    var difAlim = round2((Number(v.alimentacao) || 0) - alimDevida);

    var avisos = [];
    if (v.pendencias) avisos.push({ nivel: "crit", curto: "Pendente", texto: "Pendente: " + v.pendencias });
    if ((Number(v.diarias) || 0) > 0 && Number(v.diarias) !== noites) {
      avisos.push({ nivel: "warn", curto: "Noites ≠ diárias",
                    texto: noites + " noites e " + brl(v.diarias, 0) + " diárias de hotel" });
    }
    if (difAlim !== 0) {
      avisos.push({ nivel: "warn", curto: "Alimentação",
                    texto: "Alimentação " + (difAlim < 0 ? "a menor" : "a maior") + ": " +
                           brlSigla(Math.abs(difAlim)) + " ante a regra de " + brlSigla(alimDevida) });
    }

    return {
      mesRef: mesRefDe(v.dataIda),
      area: areaDe(v.colaborador),
      gestor: gestorDe(v.colaborador),
      noites: noites,
      hospedagem: hospedagem,

      alimDevida: alimDevida,
      difAlim: difAlim,
      avisos: avisos,

  function viagemPorId(id) {

    return null;
  }

  function proximoId() {
    var max = 0;
    db.viagens.forEach(function (v) { if (v.id > max) max = v.id; });
    return max + 1;
  }

  var CAMPOS_VIAGEM = ["tipo", "colaborador", "destino", "aeroportoOrigem", "dataIda", "dataVolta",

      if (dados[k] !== undefined) base[k] = dados[k];

    db.viagens.forEach(function (v) {

  // ---------- Uber ----------

  var cacheUber = null;

  /**
   * Interpreta uma linha do relatório do Uber Business.
   * Formato: data;hora;nome;sobrenome;--;Travel | Serviço;cidade;origem;destino;tipo;valor;valor
   */
  function parseLinhaUber(linha) {
    var p = String(linha).split(";").map(function (x) { return x.trim(); });
    while (p.length < 12) p.push("");

    var data = "";
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(p[0]);
    if (m) data = m[3] + "-" + pad(+m[1]) + "-" + pad(+m[2]); // relatório vem em MM/DD/AAAA

    var nomeRelatorio = (p[2] + " " + p[3]).replace(/\s+/g, " ").trim();
    if (nomeRelatorio === "-- --" || nomeRelatorio === "--") nomeRelatorio = "";

    return {
      linha: linha,
      data: data,
      hora: p[1] === "--" ? "" : p[1],
      nomeRelatorio: nomeRelatorio,
      servico: p[5] === "--" ? "" : p[5].replace(/^Travel \|\s*/, "").trim(),
      cidade: p[6] === "--" ? "" : p[6],
      origem: p[7] === "--" ? "" : p[7],
      destino: p[8] === "--" ? "" : p[8],
      tipo: p[9],
      valor: parseFloat(p[10]) || 0
    };
  }

  /** Nome do relatório → colaborador oficial (De-Para, depois base). */
  function resolveNome(nomeRelatorio) {
    if (!nomeRelatorio) return "";
    var alvo = normal(nomeRelatorio);
    var dp = db.params.dePara;
    for (var i = 0; i < dp.length; i++) {
      if (normal(dp[i].uber) === alvo) return dp[i].colaborador;
    }
    var c = colaborador(nomeRelatorio);
    return c ? c.nome : "";
  }

  function ehAeroporto(origem, destino) {
    var texto = normal(origem + " " + destino);
    return db.params.palavrasAeroporto.some(function (k) { return k && texto.indexOf(normal(k)) > -1; });
  }

  /** Confronta a corrida com as datas de viagem do colaborador. */
  function auditaCorrida(c, viagensPorPessoa) {
    if (!c.data) return { situacao: "sem-data", texto: "Sem data" };
    if (c.tipo !== "Fare") return { situacao: "na", texto: "n/a" };
    if (!c.colaborador) return { situacao: "sem-viagem", texto: "Sem viagem registrada" };

    var lista = viagensPorPessoa[c.colaborador];
    if (!lista || !lista.length) return { situacao: "sem-viagem", texto: "Sem viagem registrada" };

    var tol = Number(db.params.regras.toleranciaUber) || 0;
    for (var i = 0; i < lista.length; i++) {
      var v = lista[i];
      if (!v.dataIda || !v.dataVolta) continue;
      if (diasEntre(addDias(v.dataIda, -tol), c.data) >= 0 && diasEntre(c.data, addDias(v.dataVolta, tol)) >= 0) {
        return { situacao: "ok", texto: "OK", viagemId: v.id };
      }
    }
    return { situacao: "fora", texto: "Fora do período" };
  }

  /** Todas as corridas com seus campos derivados (memoizado até o próximo salvar). */
  function corridas() {
    if (cacheUber) return cacheUber;

    var porPessoa = {};
    db.viagens.forEach(function (v) {
      if (!porPessoa[v.colaborador]) porPessoa[v.colaborador] = [];
      porPessoa[v.colaborador].push(v);
    });

    cacheUber = db.uber.map(function (reg, i) {
      var c = parseLinhaUber(reg.linha);
      c.indice = i;
      c.colaborador = resolveNome(c.nomeRelatorio);
      c.desconhecido = !!c.nomeRelatorio && !c.colaborador;
      c.area = c.colaborador ? areaDe(c.colaborador) : "—";
      c.mesRef = c.data ? mesRefDe(c.data) : "";
      c.aeroporto = ehAeroporto(c.origem, c.destino);
      c.considerar = c.tipo !== "Payment";      // pagamentos da fatura não são despesa nova
      c.auditoria = auditaCorrida(c, porPessoa);
      c.alerta = c.origem && c.origem === c.destino ? "Origem = destino"
               : (c.valor > 150 ? "Corrida acima de R$ 150" : "");
      return c;
    });
    return cacheUber;
  }

  /** Importa linhas cruas do relatório, ignorando as que já estão na base. */
  function adicionarCorridas(linhas) {
    if (armazem.modo === "servidor") {
      return armazem.importarUber(linhas).then(function (estado) {
        aplica(estado);
        return estado.importacao || { novas: 0, repetidas: 0 };
      });
    }

    var existentes = {};
    db.uber.forEach(function (r) { existentes[r.linha] = 1; });
    var novas = 0, repetidas = 0;
    linhas.forEach(function (l) {
      l = l.trim();
      if (!l) return;
      if (existentes[l]) { repetidas++; return; }
      existentes[l] = 1;
      db.uber.push({ linha: l });
      novas++;
    });
    var resultado = { novas: novas, repetidas: repetidas };
    if (!novas) return Promise.resolve(resultado);
    return armazem.importarUber(linhas).then(aplica).then(function () { return resultado; });
  }

  function excluirCorrida(indice) {
    var registro = db.uber[indice];
    if (!registro) return Promise.resolve();
    if (armazem.modo === "servidor") return armazem.excluirCorrida(registro.linha).then(aplica);
    db.uber.splice(indice, 1);
    return armazem.excluirCorrida(registro.linha).then(aplica);
  }

  function limparUber() {
    if (armazem.modo === "servidor") return armazem.limparUber().then(aplica);
    db.uber = [];
    return armazem.limparUber().then(aplica);
  }

  // ---------- agregações ----------

  var CATEGORIAS = ["Aéreo", "Hospedagem", "Alimentação", "Transporte/Aux.", "Alterações", "Uber Corporativo"];

  function categoriasDaViagem(v) {
    return {
      "Aéreo": Number(v.aereo) || 0,
      "Hospedagem": v.hospedagem,
      "Alimentação": Number(v.alimentacao) || 0,
      "Transporte/Aux.": Number(v.transporte) || 0,
      "Alterações": Number(v.custoAlteracao) || 0,
      "Uber Corporativo": 0
    };
  }

  /** Meses com movimento (viagens ou Uber), em ordem cronológica. */
  function mesesComDados() {
    var set = {};
    db.viagens.forEach(function (v) { var m = mesRefDe(v.dataIda); if (m) set[m] = 1; });
    corridas().forEach(function (c) { if (c.mesRef && c.considerar) set[c.mesRef] = 1; });
    return Object.keys(set).sort(function (a, b) {
      return (anoDe(a) + a.slice(0, 2)).localeCompare(anoDe(b) + b.slice(0, 2));
    });
  }

  function anosComDados() {
    var set = {};
    mesesComDados().forEach(function (m) { set[anoDe(m)] = 1; });
    var lista = Object.keys(set).sort();
    return lista.length ? lista : [String(new Date().getFullYear())];
  }

  /** Painel anual: matriz categoria × mês, área × mês e indicadores. */
  function resumoAnual(ano) {
    var meses = [];
    for (var m = 1; m <= 12; m++) meses.push(pad(m) + "/" + ano);

    var porCategoria = {}, porArea = {}, pessoasMes = {}, totalMes = {};
    CATEGORIAS.forEach(function (c) { porCategoria[c] = {}; meses.forEach(function (m) { porCategoria[c][m] = 0; }); });
    areas().forEach(function (a) { porArea[a] = {}; meses.forEach(function (m) { porArea[a][m] = 0; }); });
    meses.forEach(function (m) { totalMes[m] = 0; pessoasMes[m] = {}; });

    var pessoas = {}, nViagens = 0, noites = 0;

    viagens().forEach(function (v) {
      var m = v.mesRef;
      if (!m || anoDe(m) !== String(ano)) return;
      var cats = categoriasDaViagem(v);
      CATEGORIAS.forEach(function (c) {
        if (!cats[c]) return;
        porCategoria[c][m] += cats[c];
        totalMes[m] += cats[c];
      });
      if (porArea[v.area]) porArea[v.area][m] += v.total;
      else if (v.total) { porArea[v.area] = porArea[v.area] || {}; porArea[v.area][m] = (porArea[v.area][m] || 0) + v.total; }
      // Conta quem viajou, mesmo que ainda não tenha custo lançado.
      pessoas[v.colaborador] = 1;
      pessoasMes[m][v.colaborador] = 1;
      if (v.tipo !== "Alteração") nViagens++;
      noites += v.noites;
    });

    corridas().forEach(function (c) {
      if (!c.considerar || !c.mesRef || anoDe(c.mesRef) !== String(ano)) return;
      porCategoria["Uber Corporativo"][c.mesRef] += c.valor;
      totalMes[c.mesRef] += c.valor;
      if (porArea[c.area]) porArea[c.area][c.mesRef] += c.valor;
      if (c.colaborador) { pessoas[c.colaborador] = 1; pessoasMes[c.mesRef][c.colaborador] = 1; }
    });

    var totalAno = 0;
    meses.forEach(function (m) { totalMes[m] = round2(totalMes[m]); totalAno += totalMes[m]; });

    var totalUber = 0;
    meses.forEach(function (m) { totalUber += porCategoria["Uber Corporativo"][m]; });

    return {
      ano: String(ano),
      meses: meses,
      categorias: CATEGORIAS,
      porCategoria: porCategoria,
      porArea: porArea,
      totalMes: totalMes,
      totalAno: round2(totalAno),
      totalUber: round2(totalUber),
      totalViagens: round2(totalAno - totalUber),
      pessoas: Object.keys(pessoas).length,
      pessoasMes: pessoasMes,
      nViagens: nViagens,
      noites: noites
    };
  }

  /** Uma linha por colaborador com despesa no ano. */
  function porColaborador(ano) {
    var mapa = {};
    function linha(nome) {
      if (!mapa[nome]) {
        mapa[nome] = { nome: nome, area: areaDe(nome), aereo: 0, hospedagem: 0, alimentacao: 0,
                       transporte: 0, alteracoes: 0, uber: 0, total: 0, viagens: 0, noites: 0 };
      }
      return mapa[nome];
    }
    viagens().forEach(function (v) {
      if (anoDe(v.mesRef) !== String(ano)) return;
      var l = linha(v.colaborador);
      l.aereo += Number(v.aereo) || 0;
      l.hospedagem += v.hospedagem;
      l.alimentacao += Number(v.alimentacao) || 0;
      l.transporte += Number(v.transporte) || 0;
      l.alteracoes += Number(v.custoAlteracao) || 0;
      l.total += v.total;
      l.noites += v.noites;
      if (v.tipo !== "Alteração") l.viagens++;
    });
    corridas().forEach(function (c) {
      if (!c.considerar || !c.colaborador || anoDe(c.mesRef) !== String(ano)) return;
      var l = linha(c.colaborador);
      l.uber += c.valor;
      l.total += c.valor;
    });
    return Object.keys(mapa).map(function (k) {
      var l = mapa[k];
      ["aereo", "hospedagem", "alimentacao", "transporte", "alteracoes", "uber", "total"].forEach(function (c) {
        l[c] = round2(l[c]);
      });
      return l;
    }).sort(function (a, b) { return b.total - a.total; });
  }

  /**
   * Indicadores da aba Análise Uber.
   * Contagem de "corridas" considera só transações do tipo Fare — gorjeta, multa e
   * estorno entram no valor, mas não são uma corrida a mais (mesma convenção da planilha).
   */
  function resumoUber(ano) {
    var lista = corridas().filter(function (c) {
      return c.considerar && (!ano || !c.mesRef || anoDe(c.mesRef) === String(ano));
    });
    var comData = lista.filter(function (c) { return c.data; });
    var total = 0, aeroporto = 0, maiorValor = 0, acima150 = 0, valorAcima150 = 0, nCorridas = 0;
    var porMes = {}, porServico = {}, porCidade = {};
    var gorjetas = 0, multas = 0, ajustes = 0;

    lista.forEach(function (c) {
      var corrida = c.tipo === "Fare";
      total += c.valor;
      if (corrida) {
        nCorridas++;
        if (c.aeroporto) aeroporto++;
        if (c.valor > maiorValor) maiorValor = c.valor;
        if (c.valor > 150) { acima150++; valorAcima150 += c.valor; }
      }
      if (c.tipo === "Tip") gorjetas += c.valor;
      if (c.tipo === "Late Payment Fee") multas += c.valor;
      if (c.tipo === "Adjustment") ajustes += c.valor;
      if (c.mesRef) {
        porMes[c.mesRef] = porMes[c.mesRef] || { n: 0, valor: 0, aeroporto: 0 };
        porMes[c.mesRef].valor += c.valor;
        if (corrida) {
          porMes[c.mesRef].n++;
          if (c.aeroporto) porMes[c.mesRef].aeroporto++;
        }
      }
      if (c.servico) {
        porServico[c.servico] = porServico[c.servico] || { n: 0, valor: 0 };
        porServico[c.servico].valor += c.valor;
        if (corrida) porServico[c.servico].n++;
      }
      if (c.cidade) {
        porCidade[c.cidade] = porCidade[c.cidade] || { n: 0, valor: 0 };
        porCidade[c.cidade].n++; porCidade[c.cidade].valor += c.valor;
      }
    });

    function ordena(obj) {
      return Object.keys(obj).map(function (k) {
        return { nome: k, n: obj[k].n, valor: round2(obj[k].valor), aeroporto: obj[k].aeroporto || 0 };
      }).sort(function (a, b) { return b.valor - a.valor; });
    }

    var alertas = corridas().filter(function (c) { return c.auditoria.situacao === "fora" || c.auditoria.situacao === "sem-viagem"; });
    var desconhecidos = {};
    corridas().forEach(function (c) { if (c.desconhecido) desconhecidos[c.nomeRelatorio] = (desconhecidos[c.nomeRelatorio] || 0) + 1; });

    return {
      n: nCorridas,
      lancamentos: lista.length,
      total: round2(total),
      ticket: nCorridas ? round2(total / nCorridas) : 0,
      aeroporto: aeroporto,
      pctAeroporto: nCorridas ? aeroporto / nCorridas : 0,
      maiorValor: round2(maiorValor),
      acima150: acima150,
      valorAcima150: round2(valorAcima150),
      gorjetas: round2(gorjetas),
      multas: round2(multas),
      ajustes: round2(ajustes),
      urbanas: lista.filter(function (c) { return c.tipo === "Fare" && !c.aeroporto; }).length,
      porMes: porMes,
      porServico: ordena(porServico),
      porCidade: ordena(porCidade),
      alertas: alertas,
      desconhecidos: Object.keys(desconhecidos).map(function (k) { return { nome: k, n: desconhecidos[k] }; }),
      periodo: comData.length
        ? { de: comData.map(function (c) { return c.data; }).sort()[0],
            ate: comData.map(function (c) { return c.data; }).sort().slice(-1)[0] }
        : null
    };
  }

  /** Ocupação diária de um mês: uma linha por colaborador em viagem. */
  function calendario(mesRef) {
    var p = String(mesRef).split("/");
    var mes = +p[0], ano = +p[1];
    var nDias = new Date(ano, mes, 0).getDate();
    var linhas = {};

    viagens().forEach(function (v) {
      if (!v.dataIda || !v.dataVolta) return;
      for (var d = 1; d <= nDias; d++) {
        var iso = ano + "-" + pad(mes) + "-" + pad(d);
        if (diasEntre(v.dataIda, iso) < 0 || diasEntre(iso, v.dataVolta) < 0) continue;
        if (!linhas[v.colaborador]) {
          linhas[v.colaborador] = { nome: v.colaborador, area: v.area, dias: {}, destino: v.destino };
        }
        var marca = iso === v.dataIda ? "go" : (iso === v.dataVolta ? "back" : "stay");
        // Ida e volta no mesmo dia (viagens encadeadas) mantêm a marca de ida.
        if (!linhas[v.colaborador].dias[d] || linhas[v.colaborador].dias[d] === "stay") {
          linhas[v.colaborador].dias[d] = marca;
        }
      }
    });

    return {
      mesRef: mesRef, nDias: nDias, ano: ano, mes: mes,
      linhas: Object.keys(linhas).sort(ordenaPt).map(function (k) { return linhas[k]; })
    };
  }

  // ---------- exportação ----------

  function csvViagens() {
    var cab = ["ID", "Tipo", "Mês ref.", "Colaborador", "Área", "Gestor direto", "Destino",
               "Aeroporto origem", "Data ida", "Data volta", "Noites", "Aéreo (R$)", "Diárias",
               "Valor diária (R$)", "Hospedagem (R$)", "Alimentação (R$)", "Transporte/Aux. (R$)",
               "Custo de alteração (R$)", "TOTAL (R$)", "Alimentação devida (regra)", "Diferença alim.",
               "Conferência", "Status", "Ref. ID alterado", "Motivo da alteração", "Pendências em aberto", "Observação"];
    var linhas = viagens().sort(function (a, b) { return a.id - b.id; }).map(function (v) {
      return [v.id, v.tipo, v.mesRef, v.colaborador, v.area, v.gestor, v.destino, v.aeroportoOrigem,
              fmtData(v.dataIda), fmtData(v.dataVolta), v.noites, v.aereo, v.diarias, v.valorDiaria,
              v.hospedagem, v.alimentacao, v.transporte, v.custoAlteracao, v.total, v.alimDevida,
              v.difAlim, v.ok ? "OK" : v.avisos.map(function (a) { return a.texto; }).join(" · "),
              v.status, v.refId || "", v.motivo, v.pendencias, v.obs];
    });
    return montaCSV(cab, linhas);
  }

  function csvUber() {
    var cab = ["Data", "Mês ref.", "Hora", "Nome no relatório", "Colaborador", "Área", "Serviço",
               "Cidade", "Origem", "Destino", "Tipo de transação", "Valor (R$)", "Aeroporto?",
               "Considerar", "Auditoria", "Alerta"];
    var linhas = corridas().map(function (c) {
      return [fmtData(c.data), c.mesRef, c.hora, c.nomeRelatorio, c.colaborador || "⚠ incluir no De-Para",
              c.area, c.servico, c.cidade, c.origem, c.destino, c.tipo, c.valor,
              c.aeroporto ? "Sim" : "Não", c.considerar ? "Sim" : "Não", c.auditoria.texto, c.alerta];
    });
    return montaCSV(cab, linhas);
  }

  function csvColaborador(ano) {
    var cab = ["Colaborador", "Área", "Viagens", "Pernoites", "Aéreo", "Hospedagem", "Alimentação",
               "Transporte/Aux.", "Alterações", "Uber", "TOTAL"];
    var linhas = porColaborador(ano).map(function (l) {
      return [l.nome, l.area, l.viagens, l.noites, l.aereo, l.hospedagem, l.alimentacao,
              l.transporte, l.alteracoes, l.uber, l.total];
    });
    return montaCSV(cab, linhas);
  }

  /** CSV com ; e vírgula decimal — abre direto no Excel em português. */
  function montaCSV(cabecalho, linhas) {
    function celula(v) {
      if (v === null || v === undefined) return "";
      if (typeof v === "number") return String(v).replace(".", ",");
      var s = String(v);
      return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    return [cabecalho.join(";")]
      .concat(linhas.map(function (l) { return l.map(celula).join(";"); }))
      .join("\r\n");
  }

  // ---------- API ----------

  window.Core = {
    // estado
    iniciar: iniciar, entrar: entrar, sair: sair, aoMudar: aoMudar,
    recarregar: recarregar, revisaoRemota: revisaoRemota,
    restaurarBase: restaurarBase, substituirEstado: substituirEstado, salvarParams: salvarParams,
    get equipeAtualizada() { return equipeAtualizada; },
    get meta() { return meta; },
    get modo() { return armazem ? armazem.modo : "local"; },
    get db() { return db; },

    // formatação
    brl: brl, brlSigla: brlSigla, brlCurto: brlCurto, parseNum: parseNum, round2: round2,
    fmtData: fmtData, fmtDataCurta: fmtDataCurta, mesRefDe: mesRefDe, mesRotulo: mesRotulo,
    mesNome: mesNome, anoDe: anoDe, iniciais: iniciais, normal: normal, ordenaPt: ordenaPt,
    diasEntre: diasEntre, addDias: addDias, toISO: toISO, toDate: toDate, pad: pad,

    // colaboradores
    colaborador: colaborador, areaDe: areaDe, gestorDe: gestorDe, areas: areas,
    colaboradoresOrdenados: colaboradoresOrdenados,
    salvarColaborador: salvarColaborador, excluirColaborador: excluirColaborador,

    // viagens
    calc: calc, viagens: viagens, viagemPorId: viagemPorId, viagemCompleta: viagemCompleta,
    viagemVazia: viagemVazia, salvarViagem: salvarViagem, excluirViagem: excluirViagem,
    duplicarViagem: duplicarViagem, alteracoesDe: alteracoesDe, porPernoite: porPernoite,
    proximoId: proximoId,

    // uber
    corridas: corridas, parseLinhaUber: parseLinhaUber, adicionarCorridas: adicionarCorridas,
    excluirCorrida: excluirCorrida, limparUber: limparUber, resolveNome: resolveNome,

    // análises
    CATEGORIAS: CATEGORIAS, resumoAnual: resumoAnual, porColaborador: porColaborador,
    resumoUber: resumoUber, calendario: calendario, mesesComDados: mesesComDados, anosComDados: anosComDados,

    // exportação
    csvViagens: csvViagens, csvUber: csvUber, csvColaborador: csvColaborador
  };
})();

</script>
<script>
/* Telas. Cada função devolve o HTML de uma aba; os eventos são delegados em app.js. */

(function () {
  "use strict";

  var C = window.Core;

  // ---------- utilidades de marcação ----------

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function pessoa(nome, sub) {
    return '<div class="person">' +
      '<span class="avatar" aria-hidden="true">' + esc(C.iniciais(nome)) + "</span>" +
      '<span style="min-width:0"><span class="person-name">' + esc(nome || "—") + "</span>" +
      (sub ? '<br><span class="t-sub">' + esc(sub) + "</span>" : "") +
      "</span></div>";
  }

  function dinheiro(v, zeroFraco) {
    if (!v && zeroFraco !== false) return '<span class="zero">—</span>';
    return C.brl(v);
  }

  function chipStatus(status) {
    var classe = status === "Fechado" ? "ok"
               : status === "Pendente" ? "warn"
               : status === "Cancelado" ? "crit"
               : "accent";
    return '<span class="chip ' + classe + '">' + esc(status) + "</span>";
  }

  function chipsConferencia(v) {
    if (v.ok) return '<span class="chip ok">OK</span>';
    return v.avisos.map(function (a) {
      return '<span class="chip ' + a.nivel + '" title="' + esc(a.texto) + '">⚠ ' + esc(a.curto || a.texto) + "</span>";
    }).join(" ");
  }

  function rota(v) {
    var origem = (v.aeroportoOrigem || "").trim();
    if (!origem) return v.destino ? '<span class="t-sub">' + esc(v.destino) + "</span>" : "";
    var codigo = origem.split(/[\s>-]/)[0].toUpperCase();
    if (codigo.length > 4) codigo = origem.slice(0, 3).toUpperCase();
    return '<span class="route" title="' + esc(origem + " → " + v.destino) + '">' +
      esc(codigo) + " ✈ " + esc(destinoCurto(v.destino)) + "</span>";
  }

  function destinoCurto(destino) {
    var d = String(destino || "").split("/")[0].trim();
    return d.length > 14 ? d.slice(0, 13) + "…" : (d || "—");
  }

  function selectHTML(nome, opcoes, valor, extra) {
    return '<select name="' + nome + '" ' + (extra || "") + ">" +
      opcoes.map(function (o) {
        var val = typeof o === "string" ? o : o.v;
        var rot = typeof o === "string" ? o : o.r;
        return '<option value="' + esc(val) + '"' + (String(val) === String(valor) ? " selected" : "") + ">" + esc(rot) + "</option>";
      }).join("") + "</select>";
  }

  function kpi(rotulo, valor, nota, pequeno) {
    return '<div class="kpi"><span class="eyebrow">' + esc(rotulo) + "</span>" +
      '<span class="kpi-value' + (pequeno ? " sm" : "") + '">' + valor + "</span>" +
      (nota ? '<span class="kpi-note">' + nota + "</span>" : "") + "</div>";
  }

  function vazio(titulo, texto) {
    return '<div class="empty"><strong>' + esc(titulo) + "</strong>" + esc(texto || "") + "</div>";
  }

  // ---------- gráficos ----------

  var CORES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];

  /**
   * Barras empilhadas mês a mês. series = [{nome, cor, valores: []}], rotulos = eixo X.
   * Fatias com 2px de folga entre si, extremidade arredondada só no topo da pilha.
   */
  function barrasEmpilhadas(rotulos, series, alturaBarra) {
    var L = 52, R = 8, T = 10, B = 26;
    var W = 1000, H = (alturaBarra || 190) + T + B;
    var plotW = W - L - R, plotH = H - T - B;

    var totais = rotulos.map(function (_, i) {
      return series.reduce(function (s, se) { return s + (se.valores[i] || 0); }, 0);
    });
    var max = Math.max.apply(null, totais.concat([1]));
    var passo = escala(max);
    var topo = Math.ceil(max / passo) * passo || passo;

    var largura = plotW / rotulos.length;
    var barW = Math.min(46, largura * 0.56);

    var svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" ' +
      'aria-label="Custo mensal por categoria" style="height:' + H + 'px">';

    for (var g = 0; g <= topo; g += passo) {
      var y = T + plotH - (g / topo) * plotH;
      svg += '<line class="grid-line" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/>';
      svg += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11">' + esc(C.brlCurto(g)) + "</text>";
    }

    rotulos.forEach(function (rot, i) {
      var cx = L + largura * i + largura / 2;
      var y = T + plotH;
      series.forEach(function (se) {
        var v = se.valores[i] || 0;
        if (v <= 0) return;
        var h = (v / topo) * plotH;
        var altura = Math.max(1, h - 2); // 2px de respiro entre fatias
        y -= h;
        svg += '<rect class="bar" x="' + (cx - barW / 2) + '" y="' + y + '" width="' + barW +
          '" height="' + altura + '" rx="2" fill="' + se.cor + '" ' +
          'data-tip="' + esc(rot + " · " + se.nome + "|" + C.brlSigla(v)) + '"/>';
      });
      svg += '<text x="' + cx + '" y="' + (T + plotH + 17) + '" text-anchor="middle" font-size="11">' + esc(rot) + "</text>";
    });

    svg += '<line class="axis-line" x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + plotH) + '" y2="' + (T + plotH) + '"/>';
    svg += "</svg>";
    return svg;
  }

  function escala(max) {
    var bruto = max / 4;
    var mag = Math.pow(10, Math.floor(Math.log10(bruto || 1)));
    var n = bruto / mag;
    return (n >= 5 ? 5 : n >= 2 ? 2 : 1) * mag;
  }

  /** Barras horizontais com rótulo direto — para rankings. */
  function barrasHorizontais(itens) {
    if (!itens.length) return vazio("Sem dados", "");
    var max = Math.max.apply(null, itens.map(function (i) { return i.valor; }).concat([1]));
    return '<div style="display:flex;flex-direction:column;gap:9px">' + itens.map(function (i) {
      var pct = Math.max(1, (i.valor / max) * 100);
      return '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center">' +
        '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(i.nome) +
        (i.sub ? ' <span class="t-sub">' + esc(i.sub) + "</span>" : "") + "</span>" +
        '<span class="num" style="font-size:12.5px">' + C.brl(i.valor) + "</span>" +
        '<span style="grid-column:1/-1;height:7px;background:var(--surface-2);border-radius:3px;overflow:hidden">' +
        '<span style="display:block;height:100%;width:' + pct + '%;background:var(--s1);border-radius:3px"></span></span>' +
        "</div>";
    }).join("") + "</div>";
  }

  function legenda(series) {
    return '<div class="legend">' + series.map(function (s) {
      return '<span class="legend-item"><span class="legend-swatch" style="background:' + s.cor + '"></span>' + esc(s.nome) + "</span>";
    }).join("") + "</div>";
  }

  // ---------- aba: painel ----------

  function painel(estado) {
    var ano = estado.ano;
    var r = C.resumoAnual(ano);
    var uber = C.resumoUber(ano);
    var pessoas = C.porColaborador(ano);
    var mesesAtivos = r.meses.filter(function (m) { return r.totalMes[m] > 0; });

    var series = r.categorias.map(function (cat, i) {
      return { nome: cat, cor: CORES[i % CORES.length], valores: r.meses.map(function (m) { return r.porCategoria[cat][m]; }) };
    }).filter(function (s) { return s.valores.some(function (v) { return v > 0; }); });

    var mediaPessoa = r.pessoas ? r.totalAno / r.pessoas : 0;
    var mediaViagem = r.nViagens ? r.totalViagens / r.nViagens : 0;
    var avisos = C.viagens().filter(function (v) { return C.anoDe(v.mesRef) === String(ano) && !v.ok; });

    var html = "";

    html += '<div class="kpis">' +
      kpi("Custo total " + ano, "R$ " + C.brl(r.totalAno, 0),
          r.nViagens + " viagens · " + r.noites + " pernoites") +
      kpi("Viagens (sem Uber)", "R$ " + C.brl(r.totalViagens, 0),
          "Média de " + C.brlSigla(mediaViagem) + " por viagem") +
      kpi("Uber corporativo", "R$ " + C.brl(r.totalUber, 0),
          (r.totalAno ? C.brl(r.totalUber / r.totalAno * 100, 1) : "0") + "% do custo total · " + uber.n + " corridas") +
      kpi("Colaboradores com despesa", String(r.pessoas),
          "Média de " + C.brlSigla(mediaPessoa) + " por pessoa") +
      "</div>";

    if (avisos.length) {
      html += '<div class="note warn"><strong>' + avisos.length + " lançamento" + (avisos.length > 1 ? "s pedem" : " pede") +
        " conferência.</strong> " +
        '<a href="#" data-ir="viagens" data-filtro="avisos" style="color:inherit">Ver na lista de viagens →</a></div>';
    }

    html += '<div class="card">' +
      '<div class="card-head"><h2>Custo mensal por categoria</h2><span class="grow"></span>' +
      '<span class="eyebrow">' + esc(ano) + "</span></div>" +
      '<div class="card-body">' + barrasEmpilhadas(r.meses.map(C.mesRotulo), series) + "</div>" +
      legenda(series) + "</div>";

    // Matriz categoria × mês (só meses com movimento, para caber na tela)
    html += '<div class="card"><div class="card-head"><h2>Composição por categoria</h2>' +
      '<span class="grow"></span><span class="t-sub">Meses com movimento</span></div>' +
      '<div class="card-body flush"><div class="table-wrap"><table><thead><tr>' +
      "<th>Categoria</th>" + mesesAtivos.map(function (m) { return '<th class="n">' + esc(C.mesRotulo(m)) + "</th>"; }).join("") +
      '<th class="n">Total ano</th><th class="n">%</th></tr></thead><tbody>' +
      r.categorias.map(function (cat, i) {
        var totalCat = mesesAtivos.reduce(function (s, m) { return s + r.porCategoria[cat][m]; }, 0);
        if (!totalCat) return "";
        return "<tr><td><span class='legend-swatch' style='display:inline-block;background:" + CORES[i % CORES.length] +
          ";margin-right:7px'></span>" + esc(cat) + "</td>" +
          mesesAtivos.map(function (m) {
            var v = r.porCategoria[cat][m];
            return '<td class="n' + (v ? "" : " zero") + '">' + (v ? C.brl(v) : "—") + "</td>";
          }).join("") +
          '<td class="n">' + C.brl(totalCat) + "</td>" +
          '<td class="n">' + (r.totalAno ? C.brl(totalCat / r.totalAno * 100, 1) : "0,0") + "%</td></tr>";
      }).join("") +
      "</tbody><tfoot><tr><td>TOTAL</td>" +
      mesesAtivos.map(function (m) { return '<td class="n">' + C.brl(r.totalMes[m]) + "</td>"; }).join("") +
      '<td class="n">' + C.brl(r.totalAno) + '</td><td class="n">100%</td></tr>' +
      '<tr><td class="t-sub">Colaboradores no mês</td>' +
      mesesAtivos.map(function (m) { return '<td class="n t-sub">' + Object.keys(r.pessoasMes[m]).length + "</td>"; }).join("") +
      '<td class="n t-sub">' + r.pessoas + '</td><td></td></tr></tfoot></table></div></div></div>';

    // Área × mês
    var areasComGasto = Object.keys(r.porArea).filter(function (a) {
      return mesesAtivos.some(function (m) { return r.porArea[a][m] > 0; });
    }).sort(function (a, b) {
      var ta = mesesAtivos.reduce(function (s, m) { return s + r.porArea[a][m]; }, 0);
      var tb = mesesAtivos.reduce(function (s, m) { return s + r.porArea[b][m]; }, 0);
      return tb - ta;
    });

    html += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">';

    html += '<div class="card"><div class="card-head"><h2>Custo por área</h2></div>' +
      '<div class="card-body flush"><div class="table-wrap"><table><thead><tr><th>Área</th>' +
      mesesAtivos.map(function (m) { return '<th class="n">' + esc(C.mesRotulo(m)) + "</th>"; }).join("") +
      '<th class="n">Total</th></tr></thead><tbody>' +
      areasComGasto.map(function (a) {
        var t = mesesAtivos.reduce(function (s, m) { return s + r.porArea[a][m]; }, 0);
        return "<tr><td>" + esc(a) + "</td>" +
          mesesAtivos.map(function (m) {
            var v = r.porArea[a][m];
            return '<td class="n' + (v ? "" : " zero") + '">' + (v ? C.brl(v, 0) : "—") + "</td>";
          }).join("") + '<td class="n">' + C.brl(t, 0) + "</td></tr>";
      }).join("") + "</tbody></table></div></div></div>";

    html += '<div class="card"><div class="card-head"><h2>Top 10 colaboradores</h2>' +
      '<span class="grow"></span><button class="btn btn-sm" data-ir="equipe">Ver todos</button></div>' +
      '<div class="card-body">' + barrasHorizontais(pessoas.slice(0, 10).map(function (p) {
        return { nome: p.nome, sub: p.viagens + (p.viagens === 1 ? " viagem" : " viagens"), valor: p.total };
      })) + "</div></div>";

    html += "</div>";
    return html;
  }

  // ---------- aba: viagens ----------

  function viagensView(estado) {
    var f = estado.filtros;
    var lista = C.viagens();

    if (f.ano) lista = lista.filter(function (v) { return C.anoDe(v.mesRef) === f.ano; });
    if (f.mes) lista = lista.filter(function (v) { return v.mesRef === f.mes; });
    if (f.area) lista = lista.filter(function (v) { return v.area === f.area; });
    if (f.status) lista = lista.filter(function (v) { return v.status === f.status; });
    if (f.tipo) lista = lista.filter(function (v) { return v.tipo === f.tipo; });
    if (f.avisos) lista = lista.filter(function (v) { return !v.ok; });
    if (f.busca) {
      var q = C.normal(f.busca);
      lista = lista.filter(function (v) {
        return C.normal([v.colaborador, v.destino, v.area, v.obs, v.aeroportoOrigem, v.motivo, "#" + v.id].join(" ")).indexOf(q) > -1;
      });
    }

    var ordem = f.ordem || "data-desc";
    lista.sort(function (a, b) {
      switch (ordem) {
        case "data-asc": return (a.dataIda || "").localeCompare(b.dataIda || "") || a.id - b.id;
        case "total-desc": return b.total - a.total;
        case "nome": return C.ordenaPt(a.colaborador, b.colaborador) || (a.dataIda || "").localeCompare(b.dataIda || "");
        case "id-desc": return b.id - a.id;
        default: return (b.dataIda || "").localeCompare(a.dataIda || "") || b.id - a.id;
      }
    });

    var soma = lista.reduce(function (s, v) { return s + v.total; }, 0);
    var noites = lista.reduce(function (s, v) { return s + v.noites; }, 0);

    var meses = C.mesesComDados();
    var html = "";

    html += '<div class="card"><div class="card-head">' +
      '<h2>Viagens</h2>' +
      '<span class="chip">' + lista.length + " lançamento" + (lista.length === 1 ? "" : "s") + "</span>" +
      '<span class="grow"></span>' +
      '<button class="btn btn-sm" data-acao="exportar-viagens">Exportar CSV</button>' +
      '<button class="btn btn-primary btn-sm" data-acao="nova-viagem">+ Nova viagem</button>' +
      "</div>" +
      '<div class="card-body" style="border-bottom:1px solid var(--border)">' +
      '<div class="toolbar">' +
      '<input type="search" class="search" name="busca" placeholder="Buscar pessoa, destino, observação…" value="' + esc(f.busca || "") + '">' +
      selectHTML("mes", [{ v: "", r: "Todos os meses" }].concat(meses.map(function (m) { return { v: m, r: C.mesRotulo(m) }; })), f.mes) +
      selectHTML("area", [{ v: "", r: "Todas as áreas" }].concat(C.areas()), f.area) +
      selectHTML("status", [{ v: "", r: "Todos os status" }].concat(C.db.params.statuses), f.status) +
      selectHTML("tipo", [{ v: "", r: "Viagens e alterações" }, "Viagem", "Alteração"], f.tipo) +
      selectHTML("ordem", [
        { v: "data-desc", r: "Mais recentes primeiro" },
        { v: "data-asc", r: "Mais antigas primeiro" },
        { v: "total-desc", r: "Maior custo" },
        { v: "nome", r: "Colaborador (A–Z)" },
        { v: "id-desc", r: "Último lançado" }
      ], ordem) +
      '<label class="chip" style="cursor:pointer;gap:6px"><input type="checkbox" name="avisos" style="width:auto"' +
      (f.avisos ? " checked" : "") + "> Só com aviso</label>" +
      (temFiltro(f) ? '<button class="btn btn-ghost btn-sm" data-acao="limpar-filtros">Limpar filtros</button>' : "") +
      "</div></div>";

    if (!lista.length) {
      html += vazio("Nenhuma viagem encontrada", "Ajuste os filtros ou lance uma viagem nova.") + "</div>";
      return html;
    }

    html += '<div class="card-body flush"><div class="table-wrap"><table><thead><tr>' +
      "<th>ID</th><th>Colaborador</th><th>Trecho</th><th>Período</th>" +
      '<th class="n">Aéreo</th><th class="n">Hospedagem</th><th class="n">Alimentação</th><th class="n">Outros</th>' +
      '<th class="n">Total</th><th>Status</th><th>Conferência</th><th class="col-acoes"></th></tr></thead><tbody>';

    var mesAtual = null;
    var agrupar = ordem === "data-desc" || ordem === "data-asc";

    lista.forEach(function (v) {
      if (agrupar && v.mesRef !== mesAtual) {
        mesAtual = v.mesRef;
        var doMes = lista.filter(function (x) { return x.mesRef === mesAtual; });
        var totalMes = doMes.reduce(function (s, x) { return s + x.total; }, 0);
        html += '<tr><td colspan="12" style="background:var(--surface-2);padding:6px 10px">' +
          '<span class="eyebrow">' + esc(C.mesNome(mesAtual)) + "</span> " +
          '<span class="t-sub">· ' + doMes.length + " lançamentos · " + C.brlSigla(totalMes) + "</span></td></tr>";
      }

      var outros = (Number(v.transporte) || 0) + (Number(v.custoAlteracao) || 0);
      html += '<tr data-id="' + v.id + '"' + (v.tipo === "Alteração" ? ' class="row-alt"' : "") + ">" +
        '<td class="num t-sub nowrap">' + (v.tipo === "Alteração" ? "↳ " : "") + v.id + "</td>" +
        "<td>" + pessoa(v.colaborador, v.area) + "</td>" +
        "<td>" + rota(v) + (v.tipo === "Alteração" ? ' <span class="chip warn">alteração de #' + esc(v.refId) + "</span>" : "") + "</td>" +
        '<td class="nowrap"><span class="num">' + C.fmtDataCurta(v.dataIda) + " → " + C.fmtDataCurta(v.dataVolta) + "</span>" +
        '<br><span class="t-sub">' + v.noites + (v.noites === 1 ? " noite" : " noites") +
        (v.diarias ? " · " + C.brl(v.diarias, 0) + " diárias" : "") + "</span></td>" +
        '<td class="n">' + dinheiro(v.aereo) + "</td>" +
        '<td class="n">' + dinheiro(v.hospedagem) +
        (v.valorDiaria ? '<br><span class="t-sub">' + C.brl(v.valorDiaria) + "/noite</span>" : "") + "</td>" +
        '<td class="n">' + dinheiro(v.alimentacao) +
        (v.difAlim ? '<br><span class="t-sub" style="color:var(--' + (v.difAlim < 0 ? "critical" : "warning") + ')">' +
          (v.difAlim > 0 ? "+" : "") + C.brl(v.difAlim) + "</span>" : "") + "</td>" +
        '<td class="n">' + dinheiro(outros) + "</td>" +
        '<td class="n"><strong>' + C.brl(v.total) + "</strong></td>" +
        "<td>" + chipStatus(v.status) + "</td>" +
        "<td>" + chipsConferencia(v) + "</td>" +
        '<td class="col-acoes"><div class="actions-cell">' +
        botaoIcone("editar", v.id, "Editar", '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>') +
        botaoIcone("alteracao", v.id, "Registrar alteração", '<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>') +
        botaoIcone("duplicar", v.id, "Duplicar", '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>') +
        botaoIcone("excluir", v.id, "Excluir", '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>') +
        "</div></td></tr>";
    });

    html += "</tbody><tfoot><tr><td colspan='4'>" + lista.length + " lançamentos · " + noites + " pernoites</td>" +
      '<td class="n">' + C.brl(lista.reduce(function (s, v) { return s + (Number(v.aereo) || 0); }, 0)) + "</td>" +
      '<td class="n">' + C.brl(lista.reduce(function (s, v) { return s + v.hospedagem; }, 0)) + "</td>" +
      '<td class="n">' + C.brl(lista.reduce(function (s, v) { return s + (Number(v.alimentacao) || 0); }, 0)) + "</td>" +
      '<td class="n">' + C.brl(lista.reduce(function (s, v) { return s + (Number(v.transporte) || 0) + (Number(v.custoAlteracao) || 0); }, 0)) + "</td>" +
      '<td class="n">' + C.brl(soma) + '</td><td colspan="2"></td><td class="col-acoes"></td></tr></tfoot></table></div></div></div>';

    return html;
  }

  function temFiltro(f) {
    return !!(f.busca || f.mes || f.area || f.status || f.tipo || f.avisos);
  }

  function botaoIcone(acao, id, titulo, caminho) {
    return '<button class="icon-btn" data-acao="' + acao + '" data-id="' + id + '" title="' + esc(titulo) + '" aria-label="' + esc(titulo) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      caminho + "</svg></button>";
  }

  // ---------- aba: calendário ----------

  function calendarioView(estado) {
    var meses = C.mesesComDados();
    var mes = estado.mesCal && meses.indexOf(estado.mesCal) > -1 ? estado.mesCal : (meses[meses.length - 1] || C.mesRefDe(C.toISO(new Date())));
    var cal = C.calendario(mes);

    var html = '<div class="card"><div class="card-head"><h2>Calendário de ' + esc(C.mesNome(mes)) + "</h2>" +
      '<span class="grow"></span>' +
      '<span class="legend-item"><span class="cal-mark go" style="width:18px">▶</span> ida</span>' +
      '<span class="legend-item"><span class="cal-mark stay" style="width:18px">■</span> em viagem</span>' +
      '<span class="legend-item"><span class="cal-mark back" style="width:18px">◀</span> retorno</span>' +
      selectHTML("mesCal", meses.map(function (m) { return { v: m, r: C.mesNome(m) }; }), mes, 'aria-label="Mês do calendário"') +
      "</div>";

    if (!cal.linhas.length) {
      return html + vazio("Ninguém em viagem neste mês", "") + "</div>";
    }

    var dias = [];
    for (var d = 1; d <= cal.nDias; d++) dias.push(d);

    html += '<div class="card-body flush"><div class="table-wrap"><table class="cal"><thead><tr>' +
      '<th class="name-col">Colaborador</th>' +
      dias.map(function (d) {
        var wd = new Date(cal.ano, cal.mes - 1, d).getDay();
        return '<th class="day' + (wd === 0 || wd === 6 ? " wknd" : "") + '">' + d + "</th>";
      }).join("") +
      '<th class="n">Dias fora</th></tr></thead><tbody>';

    cal.linhas.forEach(function (l) {
      var noites = 0;
      html += '<tr><td class="name-col">' + pessoa(l.nome, l.area) + "</td>" +
        dias.map(function (d) {
          var wd = new Date(cal.ano, cal.mes - 1, d).getDay();
          var m = l.dias[d];
          if (m) noites++;
          var simbolo = m === "go" ? "▶" : m === "back" ? "◀" : "■";
          return '<td class="day' + (wd === 0 || wd === 6 ? " wknd" : "") + '">' +
            (m ? '<span class="cal-mark ' + m + '">' + simbolo + "</span>" : "") + "</td>";
        }).join("") +
        '<td class="n">' + noites + "</td></tr>";
    });

    html += "</tbody></table></div></div></div>";
    return html;
  }

  // ---------- aba: uber ----------

  function uberView(estado) {
    var ano = estado.ano;
    var u = C.resumoUber(ano);
    var todas = C.corridas();
    var f = estado.uberFiltros;

    var lista = todas.slice();
    if (f.mes) lista = lista.filter(function (c) { return c.mesRef === f.mes; });
    if (f.situacao) lista = lista.filter(function (c) { return c.auditoria.situacao === f.situacao; });
    if (f.busca) {
      var q = C.normal(f.busca);
      lista = lista.filter(function (c) {
        return C.normal([c.colaborador, c.nomeRelatorio, c.cidade, c.origem, c.destino, c.servico].join(" ")).indexOf(q) > -1;
      });
    }
    lista.sort(function (a, b) { return (b.data || "").localeCompare(a.data || ""); });

    var html = "";

    html += '<div class="kpis">' +
      kpi("Gasto no período", "R$ " + C.brl(u.total, 0), u.n + " corridas") +
      kpi("Ticket médio", "R$ " + C.brl(u.ticket), "Corrida mais cara: " + C.brlSigla(u.maiorValor)) +
      kpi("De/para aeroporto", C.brl(u.pctAeroporto * 100, 0) + "%", u.aeroporto + " de " + u.n + " corridas") +
      kpi("Corridas acima de R$ 150", String(u.acima150), C.brlSigla(u.valorAcima150) + " concentrados") +
      "</div>";

    if (u.desconhecidos.length) {
      html += '<div class="note warn"><strong>' + u.desconhecidos.length +
        " nome" + (u.desconhecidos.length > 1 ? "s não reconhecidos" : " não reconhecido") + " no relatório.</strong> " +
        u.desconhecidos.map(function (d) {
          return '<button class="btn btn-sm" data-acao="mapear" data-nome="' + esc(d.nome) + '">' +
            esc(d.nome) + " (" + d.n + ") → cadastrar</button>";
        }).join(" ") + "</div>";
    }

    html += '<div class="card"><div class="card-head"><h2>Importar relatório do Uber Business</h2>' +
      '<span class="grow"></span><span class="t-sub">' + todas.length + " linhas na base</span></div>" +
      '<div class="card-body grid" style="gap:10px">' +
      '<div class="note">Exporte o CSV de transações no Uber Business, abra no <strong>Bloco de Notas</strong> ' +
      "(não no Excel — ele converte datas e valores errado), copie só as linhas de transação e cole abaixo. " +
      "Linhas repetidas são ignoradas automaticamente.</div>" +
      '<textarea name="colar-uber" rows="4" placeholder="05/24/2026;7:10AM;Nome;Sobrenome;--;Travel | UberX;Sao Paulo;origem;destino;Fare;66,31;66,31"></textarea>' +
      '<div class="row"><button class="btn btn-primary" data-acao="importar-uber">Importar linhas coladas</button>' +
      '<button class="btn" data-acao="exportar-uber">Exportar CSV</button>' +
      '<span class="grow"></span>' +
      '<button class="btn btn-ghost btn-sm btn-danger" data-acao="limpar-uber">Limpar base do Uber</button></div>' +
      "</div></div>";

    // Evolução mensal + serviços
    var mesesU = Object.keys(u.porMes).sort();
    html += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(400px,1fr))">';

    html += '<div class="card"><div class="card-head"><h2>Evolução mensal</h2></div>' +
      '<div class="card-body flush"><div class="table-wrap"><table><thead><tr><th>Mês</th>' +
      '<th class="n">Corridas</th><th class="n">Valor</th><th class="n">Ticket</th><th class="n">Aeroporto</th>' +
      "</tr></thead><tbody>" +
      mesesU.map(function (m) {
        var d = u.porMes[m];
        return "<tr><td>" + esc(C.mesRotulo(m)) + '</td><td class="n">' + d.n + "</td>" +
          '<td class="n">' + C.brl(d.valor) + '</td><td class="n">' + (d.n ? C.brl(d.valor / d.n) : "—") + "</td>" +
          '<td class="n">' + (d.n ? C.brl(d.aeroporto / d.n * 100, 0) + "%" : "—") + "</td></tr>";
      }).join("") + "</tbody></table></div></div></div>";

    html += '<div class="card"><div class="card-head"><h2>Por categoria de serviço</h2></div>' +
      '<div class="card-body flush"><div class="table-wrap"><table><thead><tr><th>Serviço</th>' +
      '<th class="n">Corridas</th><th class="n">Valor</th><th class="n">Ticket</th></tr></thead><tbody>' +
      u.porServico.map(function (s) {
        return "<tr><td>" + esc(s.nome) + '</td><td class="n">' + s.n + "</td>" +
          '<td class="n">' + C.brl(s.valor) + '</td><td class="n">' + (s.n ? C.brl(s.valor / s.n) : "—") + "</td></tr>";
      }).join("") + "</tbody></table></div></div></div>";

    html += '</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(400px,1fr))">';

    html += '<div class="card"><div class="card-head"><h2>Por cidade</h2></div>' +
      '<div class="card-body">' + barrasHorizontais(u.porCidade.slice(0, 10).map(function (c) {
        return { nome: c.nome, sub: c.n + " corridas", valor: c.valor };
      })) + "</div></div>";

    html += '<div class="card"><div class="card-head"><h2>Pontos de atenção</h2></div>' +
      '<div class="card-body flush"><div class="table-wrap"><table><tbody>' +
      linhaAtencao("Corridas acima de R$ 150", u.acima150 + " · " + C.brlSigla(u.valorAcima150), "Revisar necessidade e possibilidade de compartilhamento") +
      linhaAtencao("Corridas urbanas (sem trecho de aeroporto)", String(u.urbanas), "Deslocamentos dentro da cidade") +
      linhaAtencao("Multa por atraso de pagamento", C.brlSigla(u.multas), "Custo 100% evitável — ajustar o vencimento da fatura") +
      linhaAtencao("Gorjetas", C.brlSigla(u.gorjetas), "Definir se a política corporativa cobre gorjeta") +
      linhaAtencao("Ajustes e estornos", C.brlSigla(u.ajustes), "Créditos devolvidos pela Uber") +
      "</tbody></table></div></div></div>";

    html += "</div>";

    // Tabela de corridas
    html += '<div class="card"><div class="card-head"><h2>Corridas</h2>' +
      '<span class="chip">' + lista.length + '</span><span class="grow"></span>' +
      '<div class="toolbar">' +
      '<input type="search" class="search" name="busca-uber" placeholder="Buscar pessoa, cidade, endereço…" value="' + esc(f.busca || "") + '">' +
      selectHTML("mes-uber", [{ v: "", r: "Todos os meses" }].concat(mesesU.map(function (m) { return { v: m, r: C.mesRotulo(m) }; })), f.mes) +
      selectHTML("situacao-uber", [
        { v: "", r: "Toda a auditoria" }, { v: "ok", r: "OK" },
        { v: "fora", r: "⚠ Fora do período" }, { v: "sem-viagem", r: "⚠ Sem viagem registrada" },
        { v: "na", r: "n/a (encargos)" }, { v: "sem-data", r: "Sem data" }
      ], f.situacao) + "</div></div>";

    if (!lista.length) {
