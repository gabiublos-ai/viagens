<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Viagens Corporativas</title>
<meta name="description" content="Lançamento de viagens, Uber corporativo, calendário e painéis de custo.">
<style>
/* Gestão de Viagens Corporativas — folha de estilo única.
   Tokens no :root (claro). O modo escuro redefine só os tokens, nos dois escopos:
   media query (preferência do sistema) e [data-theme] (alternância manual). */

:root {
  color-scheme: light;

  --ground:        #f1f4f5;
  --surface:       #ffffff;
  --surface-2:     #e9eff0;
  --surface-3:     #dde6e7;

  --text:          #12211f;
  --text-2:        #55696a;
  --text-3:        #83969a;

  --border:        #d7e1e3;
  --border-strong: #b9c8cb;

  --accent:        #0d5c63;
  --accent-hover:  #0a474d;
  --accent-ink:    #ffffff;
  --accent-soft:   #dfeced;
  --accent-line:   #9cc4c7;

  --good:          #0ca30c;
  --warning:       #b07600;
  --warning-bg:    #fdf3dc;
  --serious:       #c25a2c;
  --critical:      #d03b3b;
  --critical-bg:   #fbe6e6;
  --good-bg:       #e2f3e2;

  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;

  --grid:          #e6ecee;
  --shadow:        0 1px 2px rgba(18, 33, 31, .06), 0 8px 24px rgba(18, 33, 31, .08);

  --r-sm: 5px;
  --r:    8px;
  --r-lg: 12px;

  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:        #0d1413;
    --surface:       #151d1d;
    --surface-2:     #1d2828;
    --surface-3:     #263332;
    --text:          #edf3f2;
    --text-2:        #a3b5b3;
    --text-3:        #7d908e;
    --border:        #2a3837;
    --border-strong: #3b4c4b;
    --accent:        #4fb3ba;
    --accent-hover:  #6ac6cc;
    --accent-ink:    #062023;
    --accent-soft:   #16302f;
    --accent-line:   #2f5f61;
    --good:          #34b334;
    --good-bg:       #12301a;
    --warning:       #e0a92c;
    --warning-bg:    #2f2717;
    --serious:       #ec835a;
    --critical:      #e66767;
    --critical-bg:   #331b1b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --grid:          #223030;
    --shadow:        0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:        #0d1413;
  --surface:       #151d1d;
  --surface-2:     #1d2828;
  --surface-3:     #263332;
  --text:          #edf3f2;
  --text-2:        #a3b5b3;
  --text-3:        #7d908e;
  --border:        #2a3837;
  --border-strong: #3b4c4b;
  --accent:        #4fb3ba;
  --accent-hover:  #6ac6cc;
  --accent-ink:    #062023;
  --accent-soft:   #16302f;
  --accent-line:   #2f5f61;
  --good:          #34b334;
  --good-bg:       #12301a;
  --warning:       #e0a92c;
  --warning-bg:    #2f2717;
  --serious:       #ec835a;
  --critical:      #e66767;
  --critical-bg:   #331b1b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --grid:          #223030;
  --shadow:        0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
p { margin: 0; }

button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.eyebrow {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text-3);
}

/* ---------- Cabeçalho ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.topbar-row {
  max-width: 1460px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

.brand-mark {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: var(--accent-ink);
  flex: none;
}
.brand-mark svg { width: 17px; height: 17px; }

.brand-name { font-weight: 650; letter-spacing: -.015em; white-space: nowrap; }
.brand-sub { font-size: 11px; color: var(--text-3); white-space: nowrap; }

.topbar-spacer { flex: 1; }

.tabs {
  max-width: 1460px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: thin;
}

.tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 9px 12px;
  color: var(--text-2);
  font-weight: 550;
  cursor: pointer;
  white-space: nowrap;
  border-radius: var(--r-sm) var(--r-sm) 0 0;
}
.tab:hover { color: var(--text); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------- Botões ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  padding: 7px 13px;
  border-radius: var(--r-sm);
  font-weight: 550;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(.5px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }

.btn-sm { padding: 4px 9px; font-size: 12.5px; }
.btn-danger { color: var(--critical); border-color: var(--border-strong); }
.btn-danger:hover { background: var(--critical-bg); border-color: var(--critical); }

.icon-btn {
  appearance: none; border: 1px solid transparent; background: none;
  color: var(--text-2); cursor: pointer; padding: 5px;
  border-radius: var(--r-sm); display: inline-grid; place-items: center;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; display: block; }

/* ---------- Formulários ---------- */

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.field .hint { font-size: 11.5px; color: var(--text-3); }

input[type="text"], input[type="date"], input[type="search"], input[type="number"], select, textarea {
  width: 100%;
  padding: 7px 10px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 64px; }
input.money { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
input[readonly] { background: var(--surface-2); color: var(--text-2); }

/* ---------- Layout ---------- */

main { max-width: 1460px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.card-head {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.card-head .grow { flex: 1; }
.card-body { padding: 16px; }
.card-body.flush { padding: 0; }

.grid { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- KPIs ---------- */

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.kpi-value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.kpi-value.sm { font-size: 20px; }
.kpi-note { font-size: 11.5px; color: var(--text-3); }

/* ---------- Tabelas ---------- */

.table-wrap { overflow-x: auto; }

/* Tabela longa com rolagem própria: assim o cabeçalho e a linha de totais
   ficam presos enquanto as linhas passam. Sem essa altura, quem rola é a
   página inteira e o `position: sticky` do thead não teria a que se prender. */
.table-wrap.rolagem { overflow: auto; max-height: calc(100vh - 300px); min-height: 340px; }
.table-wrap.rolagem tfoot td { position: sticky; bottom: 0; z-index: 2; }
.table-wrap.rolagem tfoot td.fix1,
.table-wrap.rolagem tfoot td.fix2,
.table-wrap.rolagem tfoot td.fix3,
.table-wrap.rolagem tfoot td.col-acoes { z-index: 3; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-2);
  text-align: left;
  font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-2);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tbody tr:hover td { background: var(--surface-2); }
tfoot td { padding: 9px 10px; font-weight: 650; border-top: 1px solid var(--border-strong); background: var(--surface-2); }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Tabela compacta: mesma informação em menos largura, para caber sem rolagem
   horizontal nas telas comuns. */
table.compacta { font-size: 12px; }
table.compacta thead th { font-size: 10px; padding: 6px 7px; letter-spacing: .04em; }
table.compacta tbody td { padding: 6px 7px; }
table.compacta tfoot td { padding: 7px 7px; }
table.compacta .chip { font-size: 10.5px; padding: 1px 6px; }
table.compacta .icon-btn { width: 26px; height: 26px; }
table.compacta .avatar { width: 24px; height: 24px; font-size: 9.5px; }
/* O período entra como segunda linha da coluna de trecho. */
.periodo { display: block; white-space: nowrap; margin-top: 1px; }

th.ord { cursor: pointer; user-select: none; }
th.ord:hover { color: var(--text); background: var(--surface-3); }
th.ord-ativa { color: var(--accent); }
.ord-seta { display: inline-block; width: 10px; font-size: 9px; margin-left: 3px; }
th.n { text-align: right; }
td.zero { color: var(--text-3); }
.t-sub { font-size: 11.5px; color: var(--text-3); }
.nowrap { white-space: nowrap; }
.row-alt td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }

/* ---------- Chips / status ---------- */

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 100px;
  font-size: 11.5px; font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.chip.ok      { background: var(--good-bg); color: var(--good); border-color: transparent; }
.chip.warn    { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
.chip.crit    { background: var(--critical-bg); color: var(--critical); border-color: transparent; }
.chip.accent  { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.route {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .04em;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 1px 6px;
  white-space: nowrap;
}

.person { display: flex; align-items: center; gap: 9px; min-width: 0; }
.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
  font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
  flex: none;
}
/* O nome e a área ocupam blocos próprios: só assim as reticências funcionam,
   já que max-width e text-overflow não valem para elemento inline. */
.person > span:not(.avatar) { display: block; min-width: 0; }
.person-name { display: block; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Numa coluna congelada o texto não pode vazar: corta com reticências. */
.person .t-sub { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.fix2 .person > span:not(.avatar) { max-width: 166px; overflow: hidden; }

/* ---------- Gráficos ---------- */

.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--sans); fill: var(--text-2); }
.chart .axis-line { stroke: var(--border); stroke-width: 1; }
.chart .grid-line { stroke: var(--grid); stroke-width: 1; }
.chart .bar { transition: opacity .12s ease; }
.chart .bar:hover { opacity: .75; cursor: default; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 0 16px 14px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

.tip {
  position: fixed; z-index: 90; pointer-events: none;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  box-shadow: var(--shadow);
  padding: 8px 10px; font-size: 12px; max-width: 260px;
  opacity: 0; transition: opacity .1s ease;
}
.tip.on { opacity: 1; }
.tip b { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Calendário ---------- */

.cal { border-collapse: separate; border-spacing: 0; font-size: 12px; }
.cal th, .cal td { border-bottom: 1px solid var(--grid); }
.cal .day { text-align: center; width: 26px; padding: 6px 0; font-family: var(--mono); }
.cal .name-col { position: sticky; left: 0; background: var(--surface); z-index: 2; min-width: 190px; padding-left: 12px; }
.cal thead .name-col { background: var(--surface-2); z-index: 3; }
.cal .wknd { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.cal-mark { display: grid; place-items: center; height: 20px; border-radius: 3px; font-size: 11px; line-height: 1; }
.cal-mark.go   { background: var(--accent); color: var(--accent-ink); }
.cal-mark.stay { background: var(--accent-soft); color: var(--accent); }
.cal-mark.back { background: var(--accent); color: var(--accent-ink); }

/* ---------- Modal ---------- */

dialog.modal {
  padding: 0; border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface); color: var(--text);
  box-shadow: var(--shadow);
  width: min(940px, calc(100vw - 28px));
  max-height: calc(100vh - 40px);
}
dialog.modal::backdrop { background: rgba(8, 18, 17, .45); backdrop-filter: blur(2px); }
dialog.narrow { width: min(560px, calc(100vw - 28px)); }
.modal-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 2;
}
.modal-body { padding: 18px; overflow-y: auto; }
.modal-foot {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 18px; border-top: 1px solid var(--border);
  position: sticky; bottom: 0; background: var(--surface);
}
.modal-foot .grow { flex: 1; }

.form-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 13px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; }
.c8 { grid-column: span 8; } .c12 { grid-column: span 12; }

.section-label {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 10px;
  margin-top: 4px;
}
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.summary {
  position: sticky;
  bottom: -18px;
  z-index: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.summary-line { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; }
.summary-line .num { color: var(--text); }
.summary-total { font-size: 15px; font-weight: 650; padding-top: 8px; border-top: 1px solid var(--border-strong); }

.picker { border: 1px solid var(--border-strong); border-radius: var(--r-sm); max-height: 210px; overflow-y: auto; }
.picker label {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--grid);
}
.picker label:hover { background: var(--surface-2); }
.picker input { width: auto; }
.picker .p-area { margin-left: auto; font-size: 11px; color: var(--text-3); }

/* ---------- Tela de entrada ---------- */

body.trancado .topbar-row > *:not(.brand),
body.trancado .tabs { display: none; }

.entrada {
  max-width: 380px;
  margin: 8vh auto 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 30px 28px 26px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.entrada h1 { font-size: 21px; font-weight: 650; letter-spacing: -.02em; margin: 0; }
.entrada-sub { font-size: 12.5px; color: var(--text-3); margin: -12px 0 6px; }
.entrada-marca {
  width: 40px; height: 40px; border-radius: var(--r);
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; margin-bottom: 4px;
}
.entrada-marca svg { width: 22px; height: 22px; }
.entrada .btn { justify-content: center; padding: 9px; margin-top: 4px; }
.entrada-erro { font-size: 12.5px; color: var(--critical); min-height: 1.2em; margin: 0; }

/* ---------- Diversos ---------- */

.toolbar { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
.toolbar select, .toolbar input[type="search"], .toolbar input[type="text"] { width: auto; min-width: 120px; }
.card-head select, .card-head input { width: auto; }
.toolbar .search { min-width: 200px; }

.empty { padding: 40px 20px; text-align: center; color: var(--text-3); }
.empty strong { display: block; color: var(--text-2); margin-bottom: 4px; }

.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--text); color: var(--surface);
  padding: 9px 15px; border-radius: 100px; font-size: 13px; font-weight: 550;
  box-shadow: var(--shadow);
  animation: rise .18s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.note {
  border-left: 3px solid var(--accent-line);
  background: var(--accent-soft);
  padding: 10px 13px;
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 12.5px;
  color: var(--text-2);
}
.note.warn { border-left-color: var(--warning); background: var(--warning-bg); }
.note.ok { border-left-color: var(--good); background: var(--good-bg); }

/* Nome e trajeto na tabela do Uber abrem a corrida: parecem texto, funcionam
   como botão. */
.link-cel {
  display: block; width: 100%; text-align: left;
  background: none; border: 0; padding: 0; margin: 0;
  cursor: pointer; border-radius: var(--r-sm);
}
.link-cel:hover { text-decoration: underline; text-underline-offset: 2px; }
.chip.como-botao { cursor: pointer; font: inherit; font-size: 11px; }
.chip.como-botao:hover { filter: brightness(.96); }

.motivos { display: flex; flex-direction: column; gap: 1px; max-width: 190px; }
.motivos > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Ficha da corrida */
.det-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 16px; }
.det { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.det-valor { font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
.det-trajeto {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 14px; padding: 12px;
  background: var(--surface-2); border-radius: var(--r-sm);
}
.det-trajeto .chip { align-self: flex-start; }
.lista-avisos { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }

.actions-cell { display: flex; gap: 2px; justify-content: flex-end; }

/* Colunas congeladas à esquerda: ID, colaborador e trecho ficam à vista
   enquanto o resto da tabela rola na horizontal. */
th.fix1, td.fix1 { position: sticky; left: 0; width: 44px; min-width: 44px; }
th.fix2, td.fix2 { position: sticky; left: 44px; min-width: 220px; max-width: 220px; }
th.fix3, td.fix3 { position: sticky; left: 264px; min-width: 170px; max-width: 220px; border-right: 1px solid var(--border); }

td.fix1, td.fix2, td.fix3 { background: var(--surface); z-index: 2; }
thead th.fix1, thead th.fix2, thead th.fix3 { background: var(--surface-2); z-index: 3; }
tbody tr:hover td.fix1, tbody tr:hover td.fix2, tbody tr:hover td.fix3 { background: var(--surface-2); }
tr.row-alt td.fix1, tr.row-alt td.fix2, tr.row-alt td.fix3 {
  background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface));
}
/* Na tabela de corridas só o colaborador fica congelado à esquerda. */
th.fix-uber, td.fix-uber {
  position: sticky; left: 0; z-index: 2;
  min-width: 200px; max-width: 200px;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
thead th.fix-uber { background: var(--surface-2); z-index: 3; }
tbody tr:hover td.fix-uber { background: var(--surface-2); }
td.fix-uber .person > span:not(.avatar) { max-width: 146px; overflow: hidden; }

@media (max-width: 720px) {
  th.fix-uber, td.fix-uber { position: static; min-width: 0; max-width: none; }
}

/* A alteração aparece encostada na reserva original: recuo no ID e sem
   divisória entre as duas linhas, para lerem como um bloco só. */
tr.row-presa td.fix1 { padding-left: 14px; }
tbody tr:has(+ tr.row-presa) td { border-bottom-color: transparent; }
tfoot td.fix1, tfoot td.fix2, tfoot td.fix3 { background: var(--surface-2); z-index: 2; }

/* O rótulo do mês acompanha a rolagem horizontal. */
.mes-divisor { position: sticky; left: 10px; display: inline-block; }

@media (max-width: 720px) {
  th.fix1, td.fix1, th.fix2, td.fix2, th.fix3, td.fix3 { position: static; min-width: 0; }
}

/* Ações sempre alcançáveis, mesmo com a tabela rolando na horizontal */
th.col-acoes, td.col-acoes {
  position: sticky;
  right: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
}
thead th.col-acoes { background: var(--surface-2); z-index: 3; }
td.col-acoes { z-index: 2; }
tbody tr:hover td.col-acoes { background: var(--surface-2); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

@media (max-width: 720px) {
  main { padding: 14px; gap: 14px; }
  .topbar-row { padding: 9px 14px; gap: 10px; }

  .tabs { padding: 0 14px; }
  .c3, .c4, .c6, .c8 { grid-column: span 12; }

}

<script>
/* Escreve e lê arquivos .xlsx sem depender de biblioteca.
 *
 * Um .xlsx é um zip de XMLs. Aqui gravamos as entradas sem compressão (método
 * "stored"), que o Excel aceita, e na leitura descompactamos com a API de
 * streams do próprio navegador.
 *
 * Suporta o que o modelo de importação precisa: texto, número e data. Nada de
 * fórmula, formatação condicional ou gráfico.
 */

(function () {
  "use strict";

  var enc = new TextEncoder();

  // ---------- zip ----------

  var TABELA_CRC = (function () {
    var t = new Uint32Array(256);
    for (var i = 0; i < 256; i++) {
      var c = i;
      for (var j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = TABELA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function escreve(vetor, pos, valor, bytes) {
    for (var i = 0; i < bytes; i++) vetor[pos + i] = (valor >>> (i * 8)) & 0xFF;
  }

  /** Monta o zip com as entradas dadas: [{nome, dados:Uint8Array}]. */
  function zipar(entradas) {
    var partes = [], central = [], deslocamento = 0;

    entradas.forEach(function (e) {
      var nome = enc.encode(e.nome);
      var crc = crc32(e.dados);

      var local = new Uint8Array(30 + nome.length);
      escreve(local, 0, 0x04034b50, 4);
      escreve(local, 4, 20, 2);          // versão necessária
      escreve(local, 8, 0, 2);           // método: sem compressão
      escreve(local, 14, crc, 4);
      escreve(local, 18, e.dados.length, 4);
      escreve(local, 22, e.dados.length, 4);
      escreve(local, 26, nome.length, 2);
      local.set(nome, 30);

      partes.push(local, e.dados);

      var reg = new Uint8Array(46 + nome.length);
      escreve(reg, 0, 0x02014b50, 4);
      escreve(reg, 4, 20, 2);
      escreve(reg, 6, 20, 2);
      escreve(reg, 10, 0, 2);
      escreve(reg, 16, crc, 4);
      escreve(reg, 20, e.dados.length, 4);
      escreve(reg, 24, e.dados.length, 4);
      escreve(reg, 28, nome.length, 2);
      escreve(reg, 42, deslocamento, 4);
      reg.set(nome, 46);
      central.push(reg);

      deslocamento += local.length + e.dados.length;
    });

    var tamanhoCentral = central.reduce(function (s, c) { return s + c.length; }, 0);
    var fim = new Uint8Array(22);
    escreve(fim, 0, 0x06054b50, 4);
    escreve(fim, 8, entradas.length, 2);
    escreve(fim, 10, entradas.length, 2);
    escreve(fim, 12, tamanhoCentral, 4);
    escreve(fim, 16, deslocamento, 4);

    return new Blob(partes.concat(central, [fim]),
                    { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  // ---------- escrita ----------

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");   // caracteres que o Excel recusa
  }

  function letraColuna(n) {
    var s = "";
    while (n >= 0) {
      s = String.fromCharCode(65 + (n % 26)) + s;
      n = Math.floor(n / 26) - 1;
    }
    return s;
  }

  function celula(ref, valor, estilo) {
    var st = estilo ? ' s="' + estilo + '"' : "";
    if (typeof valor === "number" && isFinite(valor)) {
      return '<c r="' + ref + '"' + st + "><v>" + valor + "</v></c>";
    }
    var texto = valor === null || valor === undefined ? "" : String(valor);
    if (!texto) return st ? '<c r="' + ref + '"' + st + "/>" : "";
    return '<c r="' + ref + '"' + st + ' t="inlineStr"><is><t xml:space="preserve">' +
      esc(texto) + "</t></is></c>";
  }

  function folha(aba) {
    var larguras = (aba.larguras || []).map(function (l, i) {
      return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + l + '" customWidth="1"/>';
    }).join("");

    var linhas = aba.linhas.map(function (linha, i) {
      var celulas = linha.map(function (v, j) {
        var estilo = (i === 0 && aba.cabecalho !== false) ? 1 : 0;
        return celula(letraColuna(j) + (i + 1), v, estilo);
      }).join("");
      return '<row r="' + (i + 1) + '">' + celulas + "</row>";
    }).join("");

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      (larguras ? "<cols>" + larguras + "</cols>" : "") +
      "<sheetData>" + linhas + "</sheetData></worksheet>";
  }

  var ESTILOS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF0D5C63"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="1"><border/></borders>' +
    '<cellStyleXfs count="1"><xf/></cellStyleXfs>' +
    '<cellXfs count="2"><xf xfId="0"/>' +
    '<xf xfId="0" fontId="1" fillId="2" applyFont="1" applyFill="1"><alignment vertical="center"/></xf></cellXfs>' +
    "</styleSheet>";

  /**
   * Gera o arquivo. abas = [{nome, linhas:[[...]], larguras:[]}]
   * @returns {Blob}
   */
  function criarXLSX(abas) {
    var entradas = [];

    function add(nome, texto) {
      entradas.push({ nome: nome, dados: enc.encode(texto) });
    }

    add("[Content_Types].xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      abas.map(function (_, i) {
        return '<Override PartName="/xl/worksheets/sheet' + (i + 1) +
          '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
      }).join("") + "</Types>");

    add("_rels/.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      "</Relationships>");

    add("xl/workbook.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      abas.map(function (a, i) {
        return '<sheet name="' + esc(a.nome) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
      }).join("") + "</sheets></workbook>");

    add("xl/_rels/workbook.xml.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      abas.map(function (_, i) {
        return '<Relationship Id="rId' + (i + 1) +
          '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' +
          (i + 1) + '.xml"/>';
      }).join("") +
      '<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      "</Relationships>");

    add("xl/styles.xml", ESTILOS);
    abas.forEach(function (a, i) { add("xl/worksheets/sheet" + (i + 1) + ".xml", folha(a)); });

    return zipar(entradas);
  }

  // ---------- leitura ----------

  function inflar(bytes, metodo) {
    if (metodo === 0) return Promise.resolve(bytes);
    if (typeof DecompressionStream === "undefined") {
      return Promise.reject(new Error("Este navegador não consegue abrir .xlsx. Salve a planilha como CSV e importe o CSV."));
    }
    var fluxo = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(fluxo).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }

  function le(vetor, pos, bytes) {
    var v = 0;
    for (var i = bytes - 1; i >= 0; i--) v = v * 256 + vetor[pos + i];
    return v;
  }

  /** Abre o zip e devolve {caminho: Uint8Array} das entradas pedidas. */
  function desziparr(buffer, querido) {
    var b = new Uint8Array(buffer);
    // Acha o fim do diretório central, varrendo de trás para frente.
    var fim = -1;
    for (var i = b.length - 22; i >= 0 && i > b.length - 66000; i--) {
      if (le(b, i, 4) === 0x06054b50) { fim = i; break; }
    }
    if (fim < 0) return Promise.reject(new Error("Arquivo não parece ser um .xlsx válido."));

    var total = le(b, fim + 10, 2);
    var pos = le(b, fim + 16, 4);
    var tarefas = [];

    for (var n = 0; n < total; n++) {
      if (le(b, pos, 4) !== 0x02014b50) break;
      var metodo = le(b, pos + 10, 2);
      var comprimido = le(b, pos + 20, 4);
      var tamNome = le(b, pos + 28, 2);
      var tamExtra = le(b, pos + 30, 2);
      var tamCom = le(b, pos + 32, 2);
      var local = le(b, pos + 42, 4);
      var nome = new TextDecoder().decode(b.subarray(pos + 46, pos + 46 + tamNome));

      if (querido(nome)) {
        var inicio = local + 30 + le(b, local + 26, 2) + le(b, local + 28, 2);
        tarefas.push(inflar(b.subarray(inicio, inicio + comprimido), metodo)
          .then((function (nome) {
            return function (dados) { return { nome: nome, dados: dados }; };
          })(nome)));
      }
      pos += 46 + tamNome + tamExtra + tamCom;
    }

    return Promise.all(tarefas).then(function (lista) {
      var mapa = {};
      lista.forEach(function (e) { mapa[e.nome] = e.dados; });
      return mapa;
    });
  }

  function texto(bytes) { return new TextDecoder().decode(bytes); }

  function desescapa(s) {
    return s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .replace(/&apos;/g, "'").replace(/&#(\d+);/g, function (_, n) { return String.fromCharCode(+n); })
      .replace(/&amp;/g, "&");
  }

  /** Data do Excel (número de série) → "AAAA-MM-DD". */
  function dataDeSerie(n) {
    var ms = Math.round((n - 25569) * 86400000);   // 25569 = 01/01/1970 no calendário do Excel
    var d = new Date(ms);
    if (isNaN(d.getTime())) return "";
    return d.toISOString().slice(0, 10);
  }

  /**
   * Lê a primeira aba do arquivo.
   * @returns {Promise<Array<Array<string|number>>>} linhas × colunas
   */
  function lerXLSX(buffer) {
    return desziparr(buffer, function (nome) {
      return nome === "xl/sharedStrings.xml" || /^xl\/worksheets\/sheet1\.xml$/.test(nome);
    }).then(function (partes) {
      var folhaXml = partes["xl/worksheets/sheet1.xml"];
      if (!folhaXml) throw new Error("Não achei a primeira planilha do arquivo.");

      var compartilhadas = [];
      if (partes["xl/sharedStrings.xml"]) {
        var xmlS = texto(partes["xl/sharedStrings.xml"]);
        var itens = xmlS.match(/<si[\s>][\s\S]*?<\/si>|<si\/>/g) || [];
        compartilhadas = itens.map(function (si) {
          var pedacos = si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
          return pedacos.map(function (t) {
            return desescapa(t.replace(/<t[^>]*>/, "").replace(/<\/t>/, ""));
          }).join("");
        });
      }

      var xml = texto(folhaXml);
      var linhas = [];
      var regexLinha = /<row[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g;
      var m;
      while ((m = regexLinha.exec(xml))) {
        var numero = +m[1] - 1;
        var celulas = [];
        var regexCel = /<c([^>]*)>([\s\S]*?)<\/c>|<c([^>]*)\/>/g;
        var c;
        while ((c = regexCel.exec(m[2]))) {
          var atributos = c[1] || c[3] || "";
          var conteudo = c[2] || "";
          var refm = /r="([A-Z]+)\d+"/.exec(atributos);
          var coluna = 0;
          if (refm) {
            var letras = refm[1];
            for (var i = 0; i < letras.length; i++) coluna = coluna * 26 + (letras.charCodeAt(i) - 64);
            coluna -= 1;
          } else {
            coluna = celulas.length;
          }

          var tipo = (/t="([^"]+)"/.exec(atributos) || [])[1] || "n";
          var valor = "";
          if (tipo === "inlineStr") {
            valor = (conteudo.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || []).map(function (t) {
              return desescapa(t.replace(/<t[^>]*>/, "").replace(/<\/t>/, ""));
            }).join("");
          } else {
            var vm = /<v>([\s\S]*?)<\/v>/.exec(conteudo);
            var bruto = vm ? desescapa(vm[1]) : "";
            if (tipo === "s") valor = compartilhadas[+bruto] || "";
            else if (tipo === "str" || tipo === "e") valor = bruto;
            else if (bruto === "") valor = "";
            else valor = Number(bruto);
          }
          celulas[coluna] = valor;
        }
        for (var k = 0; k < celulas.length; k++) if (celulas[k] === undefined) celulas[k] = "";
        linhas[numero] = celulas;
      }
      for (var j = 0; j < linhas.length; j++) if (!linhas[j]) linhas[j] = [];
      return linhas;
    });
  }

  window.XLSX = { criar: criarXLSX, ler: lerXLSX, dataDeSerie: dataDeSerie };
})();

</script>
<script>
/* Onde os dados ficam.
 *
 * Dois modos, mesma interface:
 *   servidor — site com senha; todo mundo lança na mesma base (window.MODO_SERVIDOR)
 *   local    — arquivo aberto direto no navegador; os dados ficam só naquela máquina
 *
 * Em modo servidor, cada operação devolve o estado inteiro já atualizado, então
 * nenhum cliente fica com uma versão pela metade.
 */

(function () {
  "use strict";

  var CHAVE_LOCAL = "gvc.v1";
  var servidor = !!window.MODO_SERVIDOR;

  // ---------- modo servidor ----------

  function chamar(metodo, rota, corpo) {
    return fetch("/api" + rota, {
      method: metodo,
      headers: corpo ? { "content-type": "application/json" } : undefined,
      body: corpo ? JSON.stringify(corpo) : undefined,
      credentials: "same-origin"
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (dados) {
        if (r.ok) return dados;
        var e = new Error(dados.erro || "Falha na comunicação com o servidor.");
        e.status = r.status;
        e.dados = dados;
        throw e;
      });
    });
  }

  var Servidor = {
    modo: "servidor",

    /** Devolve {autenticado, estado} — sem lançar erro quando é só falta de sessão. */
    iniciar: function () {
      return chamar("GET", "/estado").then(
        function (estado) { return { autenticado: true, estado: estado }; },
        function (e) {
          if (e.status === 401) return { autenticado: false };
          throw e;
        }
      );
    },

    entrar: function (senha, nome) {
      return chamar("POST", "/sessao", { senha: senha, nome: nome });
    },

    sair: function () { return chamar("DELETE", "/sessao"); },

    revisao: function () { return chamar("GET", "/revisao"); },
    estado: function () { return chamar("GET", "/estado"); },

    salvarViagem: function (viagem) { return chamar("PUT", "/viagem", { viagem: viagem }); },
    excluirViagem: function (id) { return chamar("DELETE", "/viagem/" + encodeURIComponent(id)); },

    salvarColaborador: function (colaborador, nomeOriginal) {
      return chamar("PUT", "/colaborador", { colaborador: colaborador, nomeOriginal: nomeOriginal || "" });
    },
    excluirColaborador: function (nome) {
      return chamar("DELETE", "/colaborador/" + encodeURIComponent(nome));
    },

    importarUber: function (linhas) { return chamar("POST", "/uber", { linhas: linhas }); },
    excluirCorrida: function (linha) { return chamar("DELETE", "/uber", { linha: linha }); },
    limparUber: function () { return chamar("DELETE", "/uber/tudo"); },

    salvarParams: function (params) { return chamar("PUT", "/params", { params: params }); },

    restaurarEstado: function (dados) { return chamar("PUT", "/estado", { dados: dados }); },
    restaurarBase: function () { return chamar("POST", "/base-original"); }
  };

  // ---------- modo local ----------

  /**
   * No modo local o app é dono do estado: cada operação mexe no objeto em memória
   * (quem chama já fez isso) e aqui só persistimos e devolvemos o mesmo estado.
   */
  function Local(obterDados) {
    function persistir() {
      var estado = {
        revisao: 0,
        atualizadoEm: new Date().toISOString(),
        atualizadoPor: "",
        dados: obterDados()
      };
      try {
        localStorage.setItem(CHAVE_LOCAL, JSON.stringify(estado.dados));
      } catch (e) {
        console.warn("Não foi possível gravar no navegador:", e);
      }
      return Promise.resolve(estado);
    }

    var api = {
      modo: "local",
      iniciar: function () {
        var dados = null;
        try {
          var bruto = localStorage.getItem(CHAVE_LOCAL);
          if (bruto) dados = JSON.parse(bruto);
        } catch (e) { /* armazenamento indisponível — começa da base original */ }
        return Promise.resolve({ autenticado: true, estado: dados ? { revisao: 0, dados: dados } : null });
      },
      entrar: function () { return Promise.resolve({}); },
      sair: function () { return Promise.resolve({}); },
      revisao: function () { return Promise.resolve({ revisao: 0 }); },
      estado: function () { return persistir(); }
    };

    ["salvarViagem", "excluirViagem", "salvarColaborador", "excluirColaborador",
     "importarUber", "excluirCorrida", "limparUber", "salvarParams",
     "restaurarEstado", "restaurarBase"].forEach(function (nome) {
      api[nome] = persistir;
    });

    return api;
  }

  window.Armazenamento = {
    ehServidor: servidor,
    criar: function (obterDados) { return servidor ? Servidor : Local(obterDados); }
  };
})();

<script>
/* Núcleo: estado, persistência e todas as regras de cálculo.
   As regras reproduzem exatamente as fórmulas da planilha original. */

(function () {
  "use strict";

  var STORAGE_KEY = "gvc.v1";

  // ---------- utilidades ----------

  var MESES_CURTOS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  var MESES_LONGOS = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
                      "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

  function brl(v, casas) {
    var n = Number(v) || 0;
    return n.toLocaleString("pt-BR", {
      minimumFractionDigits: casas === undefined ? 2 : casas,
      maximumFractionDigits: casas === undefined ? 2 : casas
    });
  }

  /** Dinheiro como aparece na tela: "R$ 1.235", sem centavos. */
  function moeda(v) { return "R$ " + brl(v, 0); }

  var brlSigla = moeda;   // nome antigo, mantido para não quebrar chamadas

  /** Compacta valores altos para eixos de gráfico: 12.000 → "12 mil". */
  function brlCurto(v) {
    var n = Number(v) || 0;
    if (Math.abs(n) >= 1000) return brl(n / 1000, 0) + " mil";
    return brl(n, 0);
  }

  /** Aceita "1.234,56", "1234.56", "1234,5" ou vazio. */
  function parseNum(txt) {
    if (typeof txt === "number") return txt;
    if (!txt) return 0;
    var s = String(txt).trim().replace(/[R$\s]/g, "");
    if (!s) return 0;
    if (s.indexOf(",") > -1) s = s.replace(/\./g, "").replace(",", ".");
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

  /** "2026-08-17" → Date local (sem deslocamento de fuso). */
  function toDate(iso) {
    if (!iso) return null;
    var p = String(iso).split("-");
    if (p.length !== 3) return null;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d.getTime()) ? null : d;
  }

  function toISO(d) {
    if (!d) return "";
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function fmtData(iso) {
    var d = toDate(iso);
    return d ? pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() : "—";
  }

  /** "17/08" — para colunas estreitas. */
  function fmtDataCurta(iso) {
    var d = toDate(iso);
    return d ? pad(d.getDate()) + "/" + pad(d.getMonth() + 1) : "—";
  }

  function diasEntre(isoA, isoB) {
    var a = toDate(isoA), b = toDate(isoB);
    if (!a || !b) return 0;
    return Math.round((b - a) / 86400000);
  }

  function addDias(iso, n) {
    var d = toDate(iso);
    if (!d) return "";
    d.setDate(d.getDate() + n);
    return toISO(d);
  }

  /** "2026-08-17" → "08/2026" */
  function mesRefDe(iso) {
    var d = toDate(iso);
    return d ? pad(d.getMonth() + 1) + "/" + d.getFullYear() : "";
  }

  /** "08/2026" → "Ago/26" */
  function mesRotulo(mesRef) {
    if (!mesRef) return "—";
    var p = mesRef.split("/");
    var m = +p[0];
    if (!m) return mesRef;
    var nome = MESES_CURTOS[m - 1];
    return nome.charAt(0).toUpperCase() + nome.slice(1) + "/" + String(p[1]).slice(-2);
  }

  function mesNome(mesRef) {
    var p = String(mesRef || "").split("/");
    return MESES_LONGOS[+p[0] - 1] ? MESES_LONGOS[+p[0] - 1] + " de " + p[1] : mesRef;
  }

  function anoDe(mesRef) { return String(mesRef || "").split("/")[1] || ""; }

  function iniciais(nome) {
    var p = String(nome || "").trim().split(/\s+/).filter(function (x) { return x.length > 2 || /^[A-ZÀ-Ú]/.test(x); });
    if (!p.length) return "?";
    var a = p[0].charAt(0);
    var b = p.length > 1 ? p[p.length - 1].charAt(0) : "";
    return (a + b).toUpperCase();
  }

  /** Comparação insensível a acento e caixa, para busca. */
  function normal(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function ordenaPt(a, b) { return String(a).localeCompare(String(b), "pt-BR"); }

  // ---------- estado ----------

  var db = null;
  var armazem = null;
  var meta = { revisao: 0, atualizadoEm: "", atualizadoPor: "", nome: "" };
  var equipeAtualizada = 0;   // nº de cadastros mexidos na última migração, para avisar na tela

  /** Usado só quando o estado guardado vem sem alguma lista (defesa). */
  var PARAMS_PADRAO = {
    meses: [], categorias: ["Aéreo", "Hospedagem", "Alimentação", "Transporte/Aux.", "Alterações", "Uber Corporativo"],
    statuses: ["Fechado", "Cotado", "Pendente", "Cancelado", "Alterada"],
    servicos: [], tiposTransacao: [],
    palavrasAeroporto: ["aeroport", "airport", "terminal", "linneu gomes", "confins", "rocha pombo"],
    regras: { jantar: 70, cafe: 30, toleranciaUber: 1 },
    dePara: [],
    conferenciasUber: {}
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function paramsBase() {
    return window.SEED && window.SEED.parametros ? window.SEED.parametros : PARAMS_PADRAO;
  }

  /** Base original da planilha — só existe quando o app roda sem servidor. */
  function estadoInicial() {
    var s = clone(window.SEED);
    return {
      versao: 1,
      baseEquipeVersao: s.baseEquipeVersao || 0,
      colaboradores: s.colaboradores,
      viagens: s.viagens,
      uber: s.uberRaw.map(function (linha) { return { linha: linha }; }),
      params: s.parametros,
      atualizadoEm: new Date().toISOString()
    };
  }

  /**
   * Abre a base. Devolve {autenticado} — no site com senha, `false` significa
   * que ainda falta entrar.
   */
  function iniciar() {
    armazem = window.Armazenamento.criar(function () { return db; });
    return armazem.iniciar().then(function (r) {
      if (!r.autenticado) return { autenticado: false };
      assume(r.estado);
      return { autenticado: true };
    });
  }

  function entrar(senha, nome) {
    return armazem.entrar(senha, nome).then(function (estado) {
      meta.nome = estado.nome || "";
      assume(estado);
      return estado;
    });
  }

  function sair() { return armazem.sair(); }

  /** Adota o estado que veio do servidor (ou do navegador, no modo local). */
  function assume(estado) {
    if (estado && estado.dados) {
      db = estado.dados;
      meta.revisao = estado.revisao || 0;
      meta.atualizadoEm = estado.atualizadoEm || "";
      meta.atualizadoPor = estado.atualizadoPor || "";
    } else if (window.SEED) {
      db = estadoInicial();
    } else {
      return;   // sem servidor e sem base local: nada a fazer
    }
    normalizaEstado();
    if (armazem.modo === "local") {
      var mexidos = atualizaBaseEquipe();
      if (mexidos) { equipeAtualizada = mexidos; armazem.salvarParams(); }
    }
    cacheUber = null;
    avisa();
  }

  /**
   * Traz a base de equipe nova para dentro de dados já salvos no navegador.
   * Atualiza quem já existe, inclui quem entrou, e nunca apaga o que a origem
   * deixou em branco (o gestor direto, por exemplo) nem quem foi cadastrado aqui.
   */
  function atualizaBaseEquipe() {
    if (!window.SEED) return 0;
    var versaoSeed = window.SEED.baseEquipeVersao || 0;
    if (!versaoSeed || (db.baseEquipeVersao || 0) >= versaoSeed) return 0;

    var porNome = {};
    db.colaboradores.forEach(function (c) { porNome[normal(c.nome)] = c; });

    var mexidos = 0;
    clone(window.SEED.colaboradores).forEach(function (novo) {
      var alvo = porNome[normal(novo.nome)];
      if (!alvo) { db.colaboradores.push(novo); mexidos++; return; }
      var mudou = false;
      Object.keys(novo).forEach(function (campo) {
        if (campo === "nome" || !novo[campo]) return;
        if (alvo[campo] !== novo[campo]) { alvo[campo] = novo[campo]; mudou = true; }
      });
      if (mudou) mexidos++;
    });

    db.colaboradores.sort(function (a, b) { return ordenaPt(a.nome, b.nome); });
    db.baseEquipeVersao = versaoSeed;
    return mexidos;
  }

  function normalizaEstado() {
    var base = paramsBase();
    db.params = db.params || {};
    ["meses", "categorias", "statuses", "servicos", "tiposTransacao", "palavrasAeroporto", "dePara"].forEach(function (k) {
      if (!db.params[k]) db.params[k] = clone(base[k] || PARAMS_PADRAO[k] || []);
    });
    db.params.regras = Object.assign({}, PARAMS_PADRAO.regras, base.regras || {}, db.params.regras || {});
    if (!db.params.conferenciasUber || typeof db.params.conferenciasUber !== "object") db.params.conferenciasUber = {};
    db.uber = db.uber || [];
    db.viagens = db.viagens || [];
    db.colaboradores = db.colaboradores || [];
  }

  var ouvintes = [];
  function aoMudar(fn) { ouvintes.push(fn); }
  function avisa() { ouvintes.forEach(function (fn) { fn(); }); }

  /** Recebe a resposta de uma escrita e passa a valer o que o servidor devolveu. */
  function aplica(estado) {
    if (estado && estado.dados && armazem.modo === "servidor") {
      db = estado.dados;
      meta.revisao = estado.revisao || 0;
      meta.atualizadoEm = estado.atualizadoEm || "";
      meta.atualizadoPor = estado.atualizadoPor || "";
      normalizaEstado();
    } else if (estado) {
      meta.atualizadoEm = estado.atualizadoEm || meta.atualizadoEm;
    }
    cacheUber = null;
    avisa();
    return estado;
  }

  /** Busca o estado no servidor — usado quando outra pessoa alterou a base. */
  function recarregar() {
    return armazem.estado().then(aplica);
  }

  /** Só a revisão, para saber se alguém mexeu. */
  function revisaoRemota() { return armazem.revisao(); }

  function substituirEstado(dados) {
    if (armazem.modo === "servidor") return armazem.restaurarEstado(dados).then(aplica);
    db = dados;
    normalizaEstado();
    return armazem.restaurarEstado(dados).then(aplica);
  }

  function restaurarBase() {
    if (armazem.modo === "servidor") return armazem.restaurarBase().then(aplica);
    db = estadoInicial();
    normalizaEstado();
    return armazem.restaurarBase().then(aplica);
  }

  /** Persiste uma mudança feita direto no objeto (parâmetros, De-Para). */
  function salvarParams() {
    return armazem.salvarParams(db.params).then(aplica);
  }

  // ---------- colaboradores ----------

  function colaborador(nome) {
    if (!nome) return null;
    var alvo = normal(nome);
    for (var i = 0; i < db.colaboradores.length; i++) {
      if (normal(db.colaboradores[i].nome) === alvo) return db.colaboradores[i];
    }
    return null;
  }

  function areaDe(nome) { var c = colaborador(nome); return c ? c.area : "—"; }
  function gestorDe(nome) { var c = colaborador(nome); return c && c.gestor ? c.gestor : "—"; }

  function areas() {
    var set = {};
    db.colaboradores.forEach(function (c) { if (c.area) set[c.area] = 1; });
    return Object.keys(set).sort(ordenaPt);
  }

  function colaboradoresOrdenados() {
    return db.colaboradores.slice().sort(function (a, b) { return ordenaPt(a.nome, b.nome); });
  }

  /** Cria ou atualiza um cadastro. Renomear leva junto as viagens e o De-Para. */
  function salvarColaborador(dados, nomeOriginal) {
    var limpo = Object.assign({}, dados);
    limpo.nome = String(limpo.nome || "").trim();
    if (!limpo.nome) return Promise.reject(new Error("Informe o nome do colaborador."));

    if (armazem.modo === "servidor") {
      return armazem.salvarColaborador(limpo, nomeOriginal || "").then(aplica);
    }

    var chave = normal(nomeOriginal || limpo.nome);
    var alvo = null;
    db.colaboradores.forEach(function (c) { if (normal(c.nome) === chave) alvo = c; });
    if (alvo) {
      if (nomeOriginal && normal(nomeOriginal) !== normal(limpo.nome)) {
        db.viagens.forEach(function (v) { if (normal(v.colaborador) === chave) v.colaborador = limpo.nome; });
        db.params.dePara.forEach(function (m) { if (normal(m.colaborador) === chave) m.colaborador = limpo.nome; });
      }
      Object.assign(alvo, limpo);
    } else {
      db.colaboradores.push(limpo);
    }
    db.colaboradores.sort(function (a, b) { return ordenaPt(a.nome, b.nome); });
    return armazem.salvarColaborador(limpo, nomeOriginal || "").then(aplica);
  }

  function excluirColaborador(nome) {
    var chave = normal(nome);
    var usos = db.viagens.filter(function (v) { return normal(v.colaborador) === chave; }).length;
    if (usos) {
      return Promise.reject(new Error("Este colaborador tem " + usos + " viagem(ns) lançada(s)."));
    }
    if (armazem.modo === "servidor") return armazem.excluirColaborador(nome).then(aplica);
    db.colaboradores = db.colaboradores.filter(function (c) { return normal(c.nome) !== chave; });
    return armazem.excluirColaborador(nome).then(aplica);
  }

  // ---------- regras de viagem ----------

  /** O que pode ter acontecido com uma viagem já aprovada. */
  var TIPOS_ALTERACAO = [
    { v: "Remarcação de voo", cancela: false, periodo: true },
    { v: "Extensão do período", cancela: false, periodo: true },
    { v: "Antecipação do retorno", cancela: false, periodo: true },
    { v: "Cancelamento da viagem", cancela: true, periodo: false },
    { v: "No-show", cancela: true, periodo: false },
    { v: "Troca de hotel", cancela: false, periodo: false },
    { v: "Outro", cancela: false, periodo: true }
  ];

  function tipoAlteracao(nome) {
    for (var i = 0; i < TIPOS_ALTERACAO.length; i++) {
      if (TIPOS_ALTERACAO[i].v === nome) return TIPOS_ALTERACAO[i];
    }
    return TIPOS_ALTERACAO[0];
  }

  /**
   * Valor devido de alimentação por pernoite. Quando o hotel serve café da
   * manhã, só o jantar é devido — o café sai da conta.
   */
  function porPernoite(cafeIncluso) {
    var r = db.params.regras;
    return (Number(r.jantar) || 0) + (cafeIncluso ? 0 : (Number(r.cafe) || 0));
  }

  /**
   * Calcula os campos derivados de uma viagem — espelha as fórmulas da aba Viagens.
   * Entrada: registro cru. Saída: objeto com os derivados.
   */
  function calc(v) {
    var noites = Math.max(0, diasEntre(v.dataIda, v.dataVolta));

    // A hospedagem passou a ser lançada pelo total. Lançamentos antigos, feitos
    // por diárias × valor, continuam valendo pelo cálculo antigo.
    var hospedagem = v.hospedagem === undefined || v.hospedagem === null || v.hospedagem === ""
      ? round2((Number(v.diarias) || 0) * (Number(v.valorDiaria) || 0))
      : round2(Number(v.hospedagem) || 0);
    var porNoite = noites ? round2(hospedagem / noites) : 0;
    var total = round2((Number(v.aereo) || 0) + hospedagem + (Number(v.alimentacao) || 0) +
                       (Number(v.transporte) || 0) + (Number(v.custoAlteracao) || 0));
    // Viagem cancelada não gera diária de alimentação.
    var cancelada = v.status === "Cancelado";
    var alimDevida = cancelada ? 0 : round2(noites * porPernoite(v.cafeIncluso));
    var difAlim = round2((Number(v.alimentacao) || 0) - alimDevida);

    var avisos = [];
    if (v.pendencias) avisos.push({ nivel: "crit", curto: "Pendente", texto: "Pendente: " + v.pendencias });
    if (hospedagem > 0 && noites === 0) {
      avisos.push({ nivel: "warn", curto: "Hospedagem sem noite",
                    texto: "Tem hospedagem lançada, mas o período não tem pernoite" });
    }
    if (difAlim !== 0) {
      avisos.push({ nivel: "warn", curto: "Alimentação",
                    texto: "Alimentação " + (difAlim < 0 ? "a menor" : "a maior") + ": " +
                           brlSigla(Math.abs(difAlim)) + " ante a regra de " + brlSigla(alimDevida) });
    }

    // Assinatura do que foi conferido: se algum valor mudar, o aviso volta.
    var assinatura = avisos.map(function (a) { return a.texto; }).join(" | ");
    var conferido = !!(v.conferencia && v.conferencia.assinatura === assinatura && avisos.length);

    return {
      mesRef: mesRefDe(v.dataIda),
      area: areaDe(v.colaborador),
      gestor: gestorDe(v.colaborador),
      noites: noites,
      // A viagem cancelada não aconteceu: não conta pernoite nem entra no calendário.
      noitesEfetivas: cancelada ? 0 : noites,
      cancelada: cancelada,
      hospedagem: hospedagem,
      porNoite: porNoite,
      total: total,
      alimDevida: alimDevida,
      difAlim: difAlim,
      avisos: avisos,
      assinatura: assinatura,
      conferido: conferido,
      ok: avisos.length === 0,
      // O que ainda pede atenção: tem aviso e ninguém validou.
      precisaConferir: avisos.length > 0 && !conferido
    };
  }

  /** Viagem + derivados num único objeto (usado por todas as telas). */
  function viagemCompleta(v) { return Object.assign({}, v, calc(v)); }

  function viagens() { return db.viagens.map(viagemCompleta); }

  function viagemPorId(id) {
    id = Number(id);
    for (var i = 0; i < db.viagens.length; i++) if (db.viagens[i].id === id) return db.viagens[i];
    return null;
  }

  function proximoId() {
    var max = 0;
    db.viagens.forEach(function (v) { if (v.id > max) max = v.id; });
    return max + 1;
  }

  var CAMPOS_VIAGEM = ["tipo", "colaborador", "destino", "aeroportoOrigem", "dataIda", "dataVolta",
                       "aereo", "diarias", "valorDiaria", "alimentacao", "transporte", "custoAlteracao",
                       "status", "refId", "motivo", "pendencias", "obs", "conferencia",
                       "hospedagem", "tipoAlteracao", "cafeIncluso"];

  function viagemVazia() {
    return {
      id: 0, tipo: "Viagem", colaborador: "", destino: "São Paulo/SP", aeroportoOrigem: "",
      dataIda: "", dataVolta: "", aereo: 0, hospedagem: 0, diarias: 0, valorDiaria: 0, alimentacao: 0,
      transporte: 0, custoAlteracao: 0, status: "Fechado", refId: null,
      motivo: "", pendencias: "", obs: "", conferencia: null, tipoAlteracao: "",
      cafeIncluso: false
    };
  }

  /** Cria ou atualiza. Devolve uma promessa com a viagem já gravada. */
  function salvarViagem(dados) {
    var base = dados.id ? clone(viagemPorId(dados.id) || viagemVazia()) : viagemVazia();
    CAMPOS_VIAGEM.forEach(function (k) {
      if (dados[k] !== undefined) base[k] = dados[k];
    });
    base.id = Number(dados.id) || 0;

    if (armazem.modo === "servidor") {
      return armazem.salvarViagem(base).then(aplica).then(function (estado) {
        return viagemPorId(base.id || (estado && estado.viagemSalva) || maiorId());
      });
    }

    var alvo = base.id ? viagemPorId(base.id) : null;
    if (!alvo) {
      alvo = viagemVazia();
      alvo.id = proximoId();
      db.viagens.push(alvo);
    }
    CAMPOS_VIAGEM.forEach(function (k) { alvo[k] = base[k]; });
    return armazem.salvarViagem(alvo).then(aplica).then(function () { return alvo; });
  }

  function maiorId() {
    var max = 0;
    db.viagens.forEach(function (v) { if (v.id > max) max = v.id; });
    return max;
  }

  function excluirViagem(id) {
    id = Number(id);
    if (armazem.modo === "servidor") return armazem.excluirViagem(id).then(aplica);

    db.viagens = db.viagens.filter(function (v) { return v.id !== id; });
    // Alterações órfãs voltam a ser viagens comuns, para nada sumir do total.
    db.viagens.forEach(function (v) {
      if (v.refId === id) { v.refId = null; v.tipo = "Viagem"; }
    });
    return armazem.excluirViagem(id).then(aplica);
  }

  function duplicarViagem(id) {
    var v = viagemPorId(id);
    if (!v) return Promise.resolve(null);
    var copia = clone(v);
    copia.id = 0;
    copia.refId = null;
    copia.tipo = "Viagem";
    return salvarViagem(copia);
  }

  /**
   * Marca (ou desmarca) a conferência de uma viagem. Guarda quem validou e o
   * que estava sendo validado — se um valor mudar depois, o aviso reaparece.
   */
  function validarConferencia(id, quem) {
    var v = viagemPorId(id);
    if (!v) return Promise.resolve(null);
    var c = calc(v);
    var nova = c.conferido ? null : {
      por: quem || meta.nome || "",
      em: new Date().toISOString(),
      assinatura: c.assinatura
    };
    return salvarViagem(Object.assign({}, v, { conferencia: nova }));
  }

  /**
   * Cancela uma viagem, guardando o motivo. Os custos já lançados podem ser
   * zerados, trocados por uma multa, ou mantidos como estão.
   * @param {string} tratamento  "zerar" | "multa" | "manter"
   */
  /**
   * Cancela a viagem. Em "multa", `custos` diz o que ficou efetivamente cobrado
   * — aéreo não reembolsado, hospedagem de no-show e a taxa/multa. Um número no
   * lugar do objeto continua valendo como a multa (chamadas antigas).
   */
  function cancelarViagem(id, motivo, tratamento, custos) {
    var v = viagemPorId(id);
    if (!v) return Promise.resolve(null);

    var novo = { status: "Cancelado", motivo: motivo || "" };
    if (tratamento === "zerar" || tratamento === "multa") {
      var c = custos && typeof custos === "object" ? custos : { multa: custos };
      var cobrado = tratamento === "multa";
      novo.aereo = cobrado ? (Number(c.aereo) || 0) : 0;
      novo.hospedagem = cobrado ? (Number(c.hospedagem) || 0) : 0;
      novo.diarias = 0;
      novo.valorDiaria = 0;
      novo.alimentacao = 0;
      novo.transporte = 0;
      novo.custoAlteracao = cobrado ? (Number(c.multa) || 0) : 0;
    }
    return salvarViagem(Object.assign({}, v, novo));
  }

  /** Alterações ligadas a uma viagem. */
  function alteracoesDe(id) {
    return db.viagens.filter(function (v) { return v.refId === Number(id); });
  }

  // ---------- Uber ----------

  var cacheUber = null;

  /**
   * Interpreta uma linha do relatório do Uber Business.
   * Formato: data;hora;nome;sobrenome;--;Travel | Serviço;cidade;origem;destino;tipo;valor;valor
   */
  function parseLinhaUber(linha) {
    var p = String(linha).split(";").map(function (x) { return x.trim(); });
    while (p.length < 12) p.push("");

    var data = "";
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(p[0]);
    if (m) data = m[3] + "-" + pad(+m[1]) + "-" + pad(+m[2]); // relatório vem em MM/DD/AAAA

    var nomeRelatorio = (p[2] + " " + p[3]).replace(/\s+/g, " ").trim();
    if (nomeRelatorio === "-- --" || nomeRelatorio === "--") nomeRelatorio = "";

    return {
      linha: linha,
      data: data,
      hora: p[1] === "--" ? "" : p[1],
      nomeRelatorio: nomeRelatorio,
      servico: p[5] === "--" ? "" : p[5].replace(/^Travel \|\s*/, "").trim(),
      cidade: p[6] === "--" ? "" : p[6],
      origem: p[7] === "--" ? "" : p[7],
      destino: p[8] === "--" ? "" : p[8],
      tipo: p[9],
      valor: parseFloat(p[10]) || 0
    };
  }

  /** Nome do relatório → colaborador oficial (De-Para, depois base). */
  function resolveNome(nomeRelatorio) {
    if (!nomeRelatorio) return "";
    var alvo = normal(nomeRelatorio);
    var dp = db.params.dePara;
    for (var i = 0; i < dp.length; i++) {
      if (normal(dp[i].uber) === alvo) return dp[i].colaborador;
    }
    var c = colaborador(nomeRelatorio);
    return c ? c.nome : "";
  }

  function ehAeroporto(origem, destino) {
    var texto = normal(origem + " " + destino);
    return db.params.palavrasAeroporto.some(function (k) { return k && texto.indexOf(normal(k)) > -1; });
  }

  /** Confronta a corrida com as datas de viagem do colaborador. */
  function auditaCorrida(c, viagensPorPessoa) {
    if (!c.data) return { situacao: "sem-data", texto: "Sem data" };
    if (c.tipo !== "Fare") return { situacao: "na", texto: "n/a" };
    if (!c.colaborador) return { situacao: "sem-viagem", texto: "Sem viagem registrada" };

    var lista = viagensPorPessoa[c.colaborador];
    if (!lista || !lista.length) return { situacao: "sem-viagem", texto: "Sem viagem registrada" };

    var tol = Number(db.params.regras.toleranciaUber) || 0;
    for (var i = 0; i < lista.length; i++) {
      var v = lista[i];
      if (!v.dataIda || !v.dataVolta) continue;
      if (diasEntre(addDias(v.dataIda, -tol), c.data) >= 0 && diasEntre(c.data, addDias(v.dataVolta, tol)) >= 0) {
        return { situacao: "ok", texto: "OK", viagemId: v.id };
      }
    }
    return { situacao: "fora", texto: "Fora do período" };
  }

  /**
   * Chave curta e estável da corrida, usada para guardar a validação. A linha
   * inteira é a chave do banco, mas é longa demais para virar nome de campo.
   */
  function chaveCorrida(linha) {
    var p = String(linha).split(";");
    return [p[0], p[1], p[2], p[3], p[9], p[10]].join("|").slice(0, 120);
  }

  /** O que fazer diante de cada motivo — aparece em "Pontos de atenção". */
  var COMENTARIO_MOTIVO = {
    "Nome fora do De-Para": "Cadastrar o vínculo em Ajustes para o custo cair na pessoa certa.",
    "Sem viagem registrada": "Lançar a viagem ou confirmar que é deslocamento urbano.",
    "Fora do período": "Conferir as datas da viagem ou ampliar a tolerância da auditoria.",
    "Sem data": "Encargo da fatura sem data no relatório — conferir na fatura do Uber.",
    "Origem igual ao destino": "Normalmente corrida cancelada após o embarque — cabe contestação.",
    "Acima de R$ 150": "Revisar necessidade, alternativa de transfer e possibilidade de carona."
  };

  /**
   * Tudo que pede atenção numa corrida, numa lista só. A tela mostra uma
   * legenda única ("Atenção") e detalha os motivos aqui embaixo.
   */
  function avisosDaCorrida(c, viagensPorPessoa) {
    var avisos = [];
    if (c.desconhecido) {
      avisos.push({ curto: "Nome fora do De-Para",
        texto: 'O relatório traz "' + c.nomeRelatorio + '", que não bate com nenhum colaborador. Cadastre o vínculo para a corrida entrar no custo da pessoa.' });
    }
    if (c.auditoria.situacao === "sem-viagem") {
      avisos.push({ curto: "Sem viagem registrada",
        texto: c.colaborador
          ? "Não existe viagem lançada para " + c.colaborador + " nessa data. Pode ser deslocamento urbano, ou a viagem ainda não foi lançada."
          : "Sem colaborador identificado, não dá para confrontar com viagem nenhuma." });
    }
    if (c.auditoria.situacao === "fora") {
      var lista = (viagensPorPessoa && viagensPorPessoa[c.colaborador]) || [];
      var perto = lista.filter(function (v) { return v.dataIda && v.dataVolta; })
        .map(function (v) { return "#" + v.id + " " + fmtData(v.dataIda) + " a " + fmtData(v.dataVolta); })
        .slice(0, 3).join(" · ");
      avisos.push({ curto: "Fora do período",
        texto: "A corrida é de " + fmtData(c.data) + " e não cai dentro de nenhuma viagem de " + c.colaborador + "." +
               (perto ? " Viagens da pessoa: " + perto + "." : "") });
    }
    if (c.auditoria.situacao === "sem-data" && c.considerar) {
      avisos.push({ curto: "Sem data",
        texto: "O relatório não traz data para esse lançamento" + (c.mesRef ? ", que foi atribuído a " + mesRotulo(c.mesRef) + " pelo lote em que veio." : ".") });
    }
    if (c.origem && c.origem === c.destino) {
      avisos.push({ curto: "Origem igual ao destino",
        texto: "Partida e chegada no mesmo endereço — normalmente corrida cancelada depois do embarque ou erro do app." });
    }
    if (c.valor > 150) {
      avisos.push({ curto: "Acima de R$ 150",
        texto: "Corrida de " + moeda(c.valor) + ", acima do teto de R$ 150. Vale conferir se havia alternativa ou carona." });
    }
    return avisos;
  }

  /** Todas as corridas com seus campos derivados (memoizado até o próximo salvar). */
  function corridas() {
    if (cacheUber) return cacheUber;

    var porPessoa = {};
    db.viagens.forEach(function (v) {
      if (!porPessoa[v.colaborador]) porPessoa[v.colaborador] = [];
      porPessoa[v.colaborador].push(v);
    });

    cacheUber = db.uber.map(function (reg, i) {
      var c = parseLinhaUber(reg.linha);
      c.indice = i;
      c.chave = chaveCorrida(reg.linha);
      c.colaborador = resolveNome(c.nomeRelatorio);
      c.desconhecido = !!c.nomeRelatorio && !c.colaborador;
      c.area = c.colaborador ? areaDe(c.colaborador) : "—";
      c.mesRef = c.data ? mesRefDe(c.data) : "";
      c.aeroporto = ehAeroporto(c.origem, c.destino);
      c.considerar = c.tipo !== "Payment";      // pagamentos da fatura não são despesa nova
      c.viagem = null;
      c.auditoria = auditaCorrida(c, porPessoa);
      if (c.auditoria.viagemId) c.viagem = viagemPorId(c.auditoria.viagemId);
      return c;
    });

    // Encargos (multa de atraso, ajuste) vêm sem data no relatório. Para não
    // ficarem de fora do painel, herdam o mês do lançamento datado mais
    // próximo: a base guarda os relatórios na ordem em que foram importados.
    cacheUber.forEach(function (c, i) {
      if (c.mesRef || !c.considerar) return;
      for (var d = 1; d < cacheUber.length; d++) {
        var vizinho = (cacheUber[i - d] && cacheUber[i - d].mesRef) ? cacheUber[i - d]
                    : (cacheUber[i + d] && cacheUber[i + d].mesRef) ? cacheUber[i + d] : null;
        if (vizinho) { c.mesRef = vizinho.mesRef; c.mesEstimado = true; break; }
      }
    });

    var validadas = db.params.conferenciasUber || {};
    cacheUber.forEach(function (c) {
      c.avisos = avisosDaCorrida(c, porPessoa);
      c.assinatura = c.avisos.map(function (a) { return a.curto; }).join(" | ");
      var conf = validadas[c.chave];
      c.conferencia = conf && conf.assinatura === c.assinatura ? conf : null;
      c.conferido = !!(c.conferencia && c.avisos.length);
      c.precisaConferir = c.avisos.length > 0 && !c.conferido;
      // Mantido para quem lia o campo antigo de alerta em texto.
      c.alerta = c.avisos.map(function (a) { return a.curto; }).join(" · ");
    });
    return cacheUber;
  }

  /** Marca (ou desmarca) a validação de uma corrida sinalizada. */
  function validarCorrida(chave, quem, motivo) {
    var c = null;
    corridas().forEach(function (x) { if (x.chave === chave) c = x; });
    if (!c || !c.avisos.length) return Promise.resolve(null);

    if (!db.params.conferenciasUber) db.params.conferenciasUber = {};
    if (c.conferido) delete db.params.conferenciasUber[chave];
    else {
      db.params.conferenciasUber[chave] = {
        por: quem || meta.nome || "",
        em: new Date().toISOString(),
        assinatura: c.assinatura,
        motivo: String(motivo || "").slice(0, 300)
      };
    }
    return salvarParams();
  }

  /** Importa linhas cruas do relatório, ignorando as que já estão na base. */
  function adicionarCorridas(linhas) {
    if (armazem.modo === "servidor") {
      return armazem.importarUber(linhas).then(function (estado) {
        aplica(estado);
        return estado.importacao || { novas: 0, repetidas: 0 };
      });
    }

    var existentes = {};
    db.uber.forEach(function (r) { existentes[r.linha] = 1; });
    var novas = 0, repetidas = 0;
    linhas.forEach(function (l) {
      l = l.trim();
      if (!l) return;
      if (existentes[l]) { repetidas++; return; }
      existentes[l] = 1;
      db.uber.push({ linha: l });
      novas++;
    });
    var resultado = { novas: novas, repetidas: repetidas };
    if (!novas) return Promise.resolve(resultado);
    return armazem.importarUber(linhas).then(aplica).then(function () { return resultado; });
  }

  function corridaPorChave(chave) {
    var achou = null;
    corridas().forEach(function (c) { if (c.chave === chave) achou = c; });
    return achou;
  }

  function excluirCorrida(indice) {
    var registro = db.uber[indice];
    if (!registro) return Promise.resolve();
    if (armazem.modo === "servidor") return armazem.excluirCorrida(registro.linha).then(aplica);
    db.uber.splice(indice, 1);
    return armazem.excluirCorrida(registro.linha).then(aplica);
  }

  function limparUber() {
    if (armazem.modo === "servidor") return armazem.limparUber().then(aplica);
    db.uber = [];
    return armazem.limparUber().then(aplica);
  }

  // ---------- agregações ----------

  var CATEGORIAS = ["Aéreo", "Hospedagem", "Alimentação", "Transporte/Aux.", "Alterações", "Uber Corporativo"];

  function categoriasDaViagem(v) {
    return {
      "Aéreo": Number(v.aereo) || 0,
      "Hospedagem": v.hospedagem,
      "Alimentação": Number(v.alimentacao) || 0,
      "Transporte/Aux.": Number(v.transporte) || 0,
      "Alterações": Number(v.custoAlteracao) || 0,
      "Uber Corporativo": 0
    };
  }

  /** Meses com movimento (viagens ou Uber), em ordem cronológica. */
  function mesesComDados() {
    var set = {};
    db.viagens.forEach(function (v) { var m = mesRefDe(v.dataIda); if (m) set[m] = 1; });
    corridas().forEach(function (c) { if (c.mesRef && c.considerar) set[c.mesRef] = 1; });
    return Object.keys(set).sort(function (a, b) {
      return (anoDe(a) + a.slice(0, 2)).localeCompare(anoDe(b) + b.slice(0, 2));
    });
  }

  function anosComDados() {
    var set = {};
    mesesComDados().forEach(function (m) { set[anoDe(m)] = 1; });
    var lista = Object.keys(set).sort();
    return lista.length ? lista : [String(new Date().getFullYear())];
  }

  /** Painel anual: matriz categoria × mês, área × mês e indicadores. */
  function resumoAnual(ano) {
    var meses = [];
    for (var m = 1; m <= 12; m++) meses.push(pad(m) + "/" + ano);

    var porCategoria = {}, porArea = {}, pessoasMes = {}, totalMes = {};
    CATEGORIAS.forEach(function (c) { porCategoria[c] = {}; meses.forEach(function (m) { porCategoria[c][m] = 0; }); });
    areas().forEach(function (a) { porArea[a] = {}; meses.forEach(function (m) { porArea[a][m] = 0; }); });
    meses.forEach(function (m) { totalMes[m] = 0; pessoasMes[m] = {}; });

    var pessoas = {}, nViagens = 0, noites = 0;

    viagens().forEach(function (v) {
      var m = v.mesRef;
      if (!m || anoDe(m) !== String(ano)) return;
      var cats = categoriasDaViagem(v);
      CATEGORIAS.forEach(function (c) {
        if (!cats[c]) return;
        porCategoria[c][m] += cats[c];
        totalMes[m] += cats[c];
      });
      if (porArea[v.area]) porArea[v.area][m] += v.total;
      else if (v.total) { porArea[v.area] = porArea[v.area] || {}; porArea[v.area][m] = (porArea[v.area][m] || 0) + v.total; }
      // Conta quem viajou, mesmo que ainda não tenha custo lançado.
      pessoas[v.colaborador] = 1;
      pessoasMes[m][v.colaborador] = 1;
      if (v.tipo !== "Alteração") nViagens++;
      noites += v.noitesEfetivas;
    });

    corridas().forEach(function (c) {
      if (!c.considerar || !c.mesRef || anoDe(c.mesRef) !== String(ano)) return;
      porCategoria["Uber Corporativo"][c.mesRef] += c.valor;
      totalMes[c.mesRef] += c.valor;
      if (porArea[c.area]) porArea[c.area][c.mesRef] += c.valor;
      if (c.colaborador) { pessoas[c.colaborador] = 1; pessoasMes[c.mesRef][c.colaborador] = 1; }
    });

    var totalAno = 0;
    meses.forEach(function (m) { totalMes[m] = round2(totalMes[m]); totalAno += totalMes[m]; });

    var totalUber = 0;
    meses.forEach(function (m) { totalUber += porCategoria["Uber Corporativo"][m]; });

    return {
      ano: String(ano),
      meses: meses,
      categorias: CATEGORIAS,
      porCategoria: porCategoria,
      porArea: porArea,
      totalMes: totalMes,
      totalAno: round2(totalAno),
      totalUber: round2(totalUber),
      totalViagens: round2(totalAno - totalUber),
      pessoas: Object.keys(pessoas).length,
      pessoasMes: pessoasMes,
      nViagens: nViagens,
      noites: noites
    };
  }

  /** Uma linha por colaborador com despesa no ano. */
  function porColaborador(ano) {
    var mapa = {};
    function linha(nome) {
      if (!mapa[nome]) {
        mapa[nome] = { nome: nome, area: areaDe(nome), aereo: 0, hospedagem: 0, alimentacao: 0,
                       transporte: 0, alteracoes: 0, uber: 0, total: 0, viagens: 0, noites: 0 };
      }
      return mapa[nome];
    }
    viagens().forEach(function (v) {
      if (anoDe(v.mesRef) !== String(ano)) return;
      var l = linha(v.colaborador);
      l.aereo += Number(v.aereo) || 0;
      l.hospedagem += v.hospedagem;
      l.alimentacao += Number(v.alimentacao) || 0;
      l.transporte += Number(v.transporte) || 0;
      l.alteracoes += Number(v.custoAlteracao) || 0;
      l.total += v.total;
      l.noites += v.noitesEfetivas;
      if (v.tipo !== "Alteração") l.viagens++;
    });
    corridas().forEach(function (c) {
      if (!c.considerar || !c.colaborador || anoDe(c.mesRef) !== String(ano)) return;
      var l = linha(c.colaborador);
      l.uber += c.valor;
      l.total += c.valor;
    });
    return Object.keys(mapa).map(function (k) {
      var l = mapa[k];
      ["aereo", "hospedagem", "alimentacao", "transporte", "alteracoes", "uber", "total"].forEach(function (c) {
        l[c] = round2(l[c]);
      });
      return l;
    }).sort(function (a, b) { return b.total - a.total; });
  }

  /**
   * Indicadores da aba Análise Uber.
   * Contagem de "corridas" considera só transações do tipo Fare — gorjeta, multa e
   * estorno entram no valor, mas não são uma corrida a mais (mesma convenção da planilha).
   */
  function resumoUber(ano) {
    var lista = corridas().filter(function (c) {
      return c.considerar && (!ano || !c.mesRef || anoDe(c.mesRef) === String(ano));
    });
    var comData = lista.filter(function (c) { return c.data; });
    var total = 0, aeroporto = 0, maiorValor = 0, acima150 = 0, valorAcima150 = 0, nCorridas = 0;
    var porMes = {}, porServico = {}, porCidade = {}, porArea = {};
    var gorjetas = 0, multas = 0, ajustes = 0;
    var nGorjetas = 0, nMultas = 0, nAjustes = 0;

    lista.forEach(function (c) {
      var corrida = c.tipo === "Fare";
      total += c.valor;
      if (corrida) {
        nCorridas++;
        if (c.aeroporto) aeroporto++;
        if (c.valor > maiorValor) maiorValor = c.valor;
        if (c.valor > 150) { acima150++; valorAcima150 += c.valor; }
      }
      if (c.tipo === "Tip") { gorjetas += c.valor; nGorjetas++; }
      if (c.tipo === "Late Payment Fee") { multas += c.valor; nMultas++; }
      if (c.tipo === "Adjustment") { ajustes += c.valor; nAjustes++; }
      if (c.mesRef) {
        porMes[c.mesRef] = porMes[c.mesRef] || { n: 0, valor: 0, aeroporto: 0 };
        porMes[c.mesRef].valor += c.valor;
        if (corrida) {
          porMes[c.mesRef].n++;
          if (c.aeroporto) porMes[c.mesRef].aeroporto++;
        }
      }
      if (c.servico) {
        porServico[c.servico] = porServico[c.servico] || { n: 0, valor: 0 };
        porServico[c.servico].valor += c.valor;
        if (corrida) porServico[c.servico].n++;
      }
      if (c.cidade) {
